name: Charter Sync Check

on:
  push:
    paths:
      - 'docs/strategy/strategic_acceleration_charter.md'
      - 'tooling/scripts/kg_sync_docs.py'
  pull_request:
    paths:
      - 'docs/strategy/strategic_acceleration_charter.md'
      - 'tooling/scripts/kg_sync_docs.py'

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyyaml
      - name: Check sync
        run: python tooling/scripts/kg_sync_docs.py docs/strategy/strategic_acceleration_charter.md --check
