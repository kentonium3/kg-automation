name: Handoff Runner

on:
  push:
    paths:
      - 'ai-agents/shared/handoffs/*.json'
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          # Ensure we operate on the SAME ref that triggered the run
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Run handoff runner
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python tooling/scripts/handoff_runner.py

      # NEW: show and stage changes BEFORE deciding to commit
      - name: Show pending changes
        run: |
          echo "::group::git status"
          git status --porcelain
          echo "::endgroup::"
          echo "::group::git diff (names)"
          git diff --name-only
          echo "::endgroup::"

      - name: Commit response if changed
        run: |
          git config user.name "handoff-runner[bot]"
          git config user.email "handoff-runner@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "handoff: automated response by handoff-runner"
            # Make sure we push to the same ref we checked out
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi
