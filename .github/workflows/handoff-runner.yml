name: Handoff Runner

on:
  push:
    branches-ignore: ['main']
    paths:
      - 'ai-agents/shared/handoffs/**.json'
  pull_request:
    branches-ignore: ['main']
    paths:
      - 'ai-agents/shared/handoffs/**.json'
  workflow_dispatch:

jobs:
  run:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Run handoff runner
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python tooling/scripts/handoff_runner.py

      - name: Show pending changes
        run: |
          echo "::group::git status"
          git status --porcelain || true
          echo "::endgroup::"
          echo "::group::git diff (names)"
          git diff --name-only || true
          echo "::endgroup::"

      - name: Commit response if changed
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "handoff-runner[bot]"
          git config user.email "handoff-runner@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "handoff: automated response by handoff-runner"
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi
