name: Handoff Runner

on:
  workflow_dispatch:
  push:
    branches-ignore: ['main']
    paths:
      - 'ai-agents/shared/handoffs/**.json'
      - 'tooling/scripts/handoff_runner.py'
  pull_request:
    branches-ignore: ['main']
    paths:
      - 'ai-agents/shared/handoffs/**.json'

permissions:
  contents: write

jobs:
  run:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run handoff runner
        run: python tooling/scripts/handoff_runner.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "handoff-runner[bot]"
            git config user.email "handoff-runner@local"
            git add -A
            git commit -m "handoff: automated response by handoff-runner"
          else
            echo "No changes to commit."
          fi

      - name: Push branch (always)
        run: |
          BR="${GITHUB_REF#refs/heads/}"
          echo "Pushing HEAD to origin:${BR}"
          git push origin "HEAD:${BR}"
