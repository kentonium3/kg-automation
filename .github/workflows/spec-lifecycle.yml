name: Spec Lifecycle Labels

on:
  issues:
    types: [labeled, unlabeled, opened, reopened]

permissions:
  issues: write

jobs:
  priority-field-sync:
    # Mirror the issue's effective priority label (P1-* / P2-* / P3-*) onto the
    # Felix Roadmap project's Priority single-select field. Uses a dedicated PAT
    # (PROJECT_SYNC_PAT, scope=project only, held by kg-felix-bot) — the default
    # GITHUB_TOKEN cannot write to a user-owned project. See #523.
    if: >-
      github.event.action == 'opened' ||
      github.event.action == 'reopened' ||
      (github.event.action == 'labeled' && startsWith(github.event.label.name, 'P')) ||
      (github.event.action == 'unlabeled' && startsWith(github.event.label.name, 'P'))
    runs-on: ubuntu-latest
    steps:
      - name: Sync priority to project field
        uses: actions/github-script@v8
        env:
          PROJECT_ID: PVT_kwHOCuNl-84BT-na
          FIELD_ID: PVTSSF_lAHOCuNl-84BT-nazhUrWLI
        with:
          github-token: ${{ secrets.PROJECT_SYNC_PAT }}
          script: |
            const OPTIONS = {
              P1: 'c5a90f0a',
              P2: 'ca2b4a3f',
              P3: 'b130af01',
              none: '530664a5',
            };
            const projectId = process.env.PROJECT_ID;
            const fieldId = process.env.FIELD_ID;

            const labels = context.payload.issue.labels.map(l => l.name);
            let priority = 'none';
            if (labels.some(l => l.startsWith('P1-'))) priority = 'P1';
            else if (labels.some(l => l.startsWith('P2-'))) priority = 'P2';
            else if (labels.some(l => l.startsWith('P3-'))) priority = 'P3';
            const optionId = OPTIONS[priority];
            core.info(`Issue #${context.issue.number} effective priority: ${priority}`);

            const lookup = await github.graphql(
              `query($number: Int!, $owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    projectItems(first: 20) { nodes { id project { id } } }
                  }
                }
              }`,
              { owner: context.repo.owner, repo: context.repo.repo, number: context.issue.number }
            );

            let itemId = lookup.repository.issue.projectItems.nodes
              .find(n => n.project.id === projectId)?.id;

            if (!itemId) {
              // Auto-add-to-project may not have fired yet (race on issue creation).
              // Add the issue ourselves; addProjectV2ItemById is idempotent.
              const added = await github.graphql(
                `mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                    item { id }
                  }
                }`,
                { projectId, contentId: context.payload.issue.node_id }
              );
              itemId = added.addProjectV2ItemById.item.id;
              core.info(`Added issue to project as item ${itemId}`);
            }

            await github.graphql(
              `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) { projectV2Item { id } }
              }`,
              { projectId, itemId, fieldId, optionId }
            );
            core.info(`Set Priority=${priority} on item ${itemId}`);

  priority-promotion:
    # When P1/P2 priority label is added, add spec: pending and remove spec: brief
    if: >-
      github.event.action == 'labeled' &&
      contains(fromJSON('["P1-feature","P2-feature","P1-infra","P2-infra"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - name: Check for spec labels
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            // Skip if already spec: ready or spec: pending
            if (labels.includes('spec: ready') || labels.includes('spec: pending')) {
              core.setOutput('skip', 'true');
              return;
            }
            // Skip non-feature/infra issues (bugs, RFCs, debt)
            const skipTypes = ['P1-rfc', 'P2-bug', 'P2-debt', 'P3-candidate'];
            if (skipTypes.some(t => labels.includes(t))) {
              core.setOutput('skip', 'true');
              return;
            }
            core.setOutput('skip', 'false');

      - name: Add spec pending and comment
        if: steps.check.outputs.skip != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            // Add spec: pending
            await github.rest.issues.addLabels({
              owner, repo, issue_number,
              labels: ['spec: pending']
            });

            // Remove spec: brief if present
            const labels = context.payload.issue.labels.map(l => l.name);
            if (labels.includes('spec: brief')) {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number,
                name: 'spec: brief'
              }).catch(() => {});
            }

            // Post reminder comment
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: `This issue was promoted to ${context.payload.label.name}. Before it can enter the spec-kitty workflow, the issue body needs to meet the [template standard](/.github/ISSUE_TEMPLATE/feature.md).\n\nWhen the body is complete, swap \`spec: pending\` → \`spec: ready\`.`
            });

  spec-ready-cleanup:
    # When spec: ready is added, remove spec: pending and spec: brief
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'spec: ready'
    runs-on: ubuntu-latest
    steps:
      - name: Remove prior spec labels
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const labels = context.payload.issue.labels.map(l => l.name);

            for (const label of ['spec: pending', 'spec: brief']) {
              if (labels.includes(label)) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number,
                  name: label
                }).catch(() => {});
              }
            }
