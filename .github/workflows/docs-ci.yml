name: Docs CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pr-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml

      - name: Validate docs
        run: python tooling/scripts/validate_docs.py

      # Semantic validation of the architecture data store (#544). Now a
      # BLOCKING gate (#545 cleaned the data): --strict exits non-zero on any
      # finding, so a future-dated credential, a service-typed entry missing a
      # health_check, a bad status, or a stale last_updated fails the build.
      # --github also emits ::warning:: annotations for visibility. Stdlib only.
      - name: Validate architecture data (semantic — #544/#545)
        run: python tooling/scripts/validate_architecture_data.py --strict --github

      # Generated-file freshness (#987). frontmatter.schema.json and the status
      # list in doc-standards.md are BUILD OUTPUT derived from
      # allowed-values.json; both had already drifted from it before generation
      # existed. The pre-commit hook runs this too, but the hook is bypassable
      # with --no-verify, so CI is the real gate. Triggers are unchanged: this
      # workflow already fires on push to main AND pull_request, which matters
      # because spec-kitty merges land as merge commits and never fire a
      # pull_request event.
      - name: Check generated doc standards are fresh (#987)
        run: python tooling/scripts/generate_doc_standards.py --check
