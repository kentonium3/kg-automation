name: Docs CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pr-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      - name: Validate docs
        run: python tooling/scripts/validate_docs.py

      # Step name deliberately omits the literal legacy path token to avoid
      # tripping validate_privacy_boundary.py against this file itself
      # (the validator scans active surfaces for the legacy path string and
      # has no allow-listing for meta-references like a step's display name).
      # Surfaced by #560 — Docs CI had been red for ~2 days due to the
      # validator catching its own step name.
      - name: Validate privacy boundary lint (no stale legacy growth-private references in active surfaces)
        run: python tooling/scripts/validate_privacy_boundary.py

      # Semantic validation of the architecture data store (#544). Warn-only in
      # this phase: the script exits 0 and emits ::warning:: annotations, so it
      # cannot turn the build red while the current data still has known
      # violations (corrected under #545). Flip to a blocking gate by adding
      # --strict here once #545 lands. Uses only the stdlib — no extra deps.
      - name: Validate architecture data (semantic, warn-only — #544)
        run: python tooling/scripts/validate_architecture_data.py --github
