name: Docs CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pr-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      - name: Validate docs
        run: python tooling/scripts/validate_docs.py

      - name: Validate privacy boundary lint (no stale 02-Growth/_private references in active surfaces)
        run: python tooling/scripts/validate_privacy_boundary.py
