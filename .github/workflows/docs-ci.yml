name: Docs CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pr-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      - name: Validate docs
        run: python tooling/scripts/validate_docs.py

      # Step name deliberately omits the literal legacy path token to avoid
      # tripping validate_privacy_boundary.py against this file itself
      # (the validator scans active surfaces for the legacy path string and
      # has no allow-listing for meta-references like a step's display name).
      # Surfaced by #560 — Docs CI had been red for ~2 days due to the
      # validator catching its own step name.
      - name: Validate privacy boundary lint (no stale legacy growth-private references in active surfaces)
        run: python tooling/scripts/validate_privacy_boundary.py

      # Semantic validation of the architecture data store (#544). Now a
      # BLOCKING gate (#545 cleaned the data): --strict exits non-zero on any
      # finding, so a future-dated credential, a service-typed entry missing a
      # health_check, a bad status, or a stale last_updated fails the build.
      # --github also emits ::warning:: annotations for visibility. Stdlib only.
      - name: Validate architecture data (semantic — #544/#545)
        run: python tooling/scripts/validate_architecture_data.py --strict --github
