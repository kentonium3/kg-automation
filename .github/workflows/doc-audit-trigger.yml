name: Doc Audit Trigger

on:
  push:
    branches: [main]

permissions:
  issues: write
  contents: read

jobs:
  create-audit-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Identify affected domains
        id: domains
        run: |
          DOMAIN_MAP="docs/design/architecture/data/doc-domain-map.json"
          if [ ! -f "$DOMAIN_MAP" ]; then
            echo "Domain map not found — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get files changed in this push
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed files detected — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Match changed files against exact paths in the domain map
          AFFECTED_DOMAINS=""
          for domain in $(jq -r '.domains | keys[]' "$DOMAIN_MAP"); do
            DOMAIN_PATHS=$(jq -r --arg d "$domain" '.domains[$d] | .[]' "$DOMAIN_MAP")
            for changed in $CHANGED_FILES; do
              while IFS= read -r domain_path; do
                if [[ "$changed" == "$domain_path" ]]; then
                  if [[ ! ",$AFFECTED_DOMAINS," == *",$domain,"* ]]; then
                    AFFECTED_DOMAINS="${AFFECTED_DOMAINS:+$AFFECTED_DOMAINS,}$domain"
                  fi
                  break 2
                fi
              done <<< "$DOMAIN_PATHS"
            done
          done

          if [ -z "$AFFECTED_DOMAINS" ]; then
            echo "No domain-mapped paths affected — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "affected_domains=$AFFECTED_DOMAINS" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build audit checklist
        if: steps.domains.outputs.skip != 'true'
        run: |
          DOMAIN_MAP="docs/design/architecture/data/doc-domain-map.json"
          IFS=',' read -ra DOMAINS <<< "${{ steps.domains.outputs.affected_domains }}"
          CHECKLIST=""
          for domain in "${DOMAINS[@]}"; do
            DOCS=$(jq -r --arg d "$domain" '.domains[$d] // [] | .[]' "$DOMAIN_MAP")
            if [ -n "$DOCS" ]; then
              CHECKLIST="${CHECKLIST}\n### ${domain}\n"
              while IFS= read -r doc; do
                CHECKLIST="${CHECKLIST}- [ ] ${doc}\n"
              done <<< "$DOCS"
            fi
          done

          echo -e "$CHECKLIST" > /tmp/audit-checklist.md

      - name: Create audit issue
        if: steps.domains.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_MSG=$(git log -1 --pretty=%s)
          AFFECTED_DOMAINS="${{ steps.domains.outputs.affected_domains }}"

          BODY="## Doc Audit: ${SHORT_SHA}

          **Commit**: ${SHORT_SHA} — ${COMMIT_MSG}
          **Affected domains**: ${AFFECTED_DOMAINS}

          Review the following documentation for accuracy after this change:

          $(cat /tmp/audit-checklist.md)

          ---
          *Auto-generated by doc-audit-trigger. See doc-domain-map.json for scope.*"

          LABEL_ARGS="--label P2-debt --label doc-audit"
          IFS=',' read -ra DOMAINS <<< "$AFFECTED_DOMAINS"
          for domain in "${DOMAINS[@]}"; do
            LABEL_ARGS="$LABEL_ARGS --label $domain"
          done

          gh issue create \
            --title "Doc audit: ${SHORT_SHA} (${AFFECTED_DOMAINS})" \
            $LABEL_ARGS \
            --body "$BODY"
