name: Test CI

# Runs the non-live pytest suite on push and PR.
#
# Rationale: per kg-automation#537 the test suite is the only practical pre-merge
# gate (the repo pushes directly to main). Without this workflow, date-sensitive
# regressions land silently — already happened twice during the F-002
# architecture review window.
#
# This workflow is intentionally separate from docs-ci.yml because the two cover
# different areas of concern: docs-ci validates the documentation-schema invariants;
# test-ci validates the Python test suite. Folding them would couple unrelated
# failure modes.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions actually in play, per kentonium3/kg-automation#920:
        #   3.12 - what office2 RUNS. Helpers under scripts/** are read live
        #          from the office2 checkout, so merging to main IS the deploy;
        #          there is no staging step between a green CI run and
        #          production execution. This is the version that must be green.
        #   3.13 - what both development machines run (Mac, and office4's bare
        #          python3). Catches a dev-only failure before it costs a
        #          debugging session.
        # 3.11 was the previous pin and is deliberately dropped: nothing in the
        # fleet runs it and no requires-python declares it, so exercising it was
        # not coverage. fail-fast is off so one version failing still reports
        # the other.
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run non-live test suite
        run: make test
        env:
          # Belt-and-suspenders: leave LIVE_SMOKE_ENABLED unset so live_smoke
          # tests skip even if a future change accidentally turns them on
          # by default.
          LIVE_SMOKE_ENABLED: ""
