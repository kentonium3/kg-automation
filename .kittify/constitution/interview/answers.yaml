schema_version: 1.0.0
mission: software-dev
profile: comprehensive
answers:
  project_intent: Drive accountable action on personal and business goals 
    through always-on automation, frictionless        capture, and proactive 
    follow-up.
  languages_frameworks: Python 3.11+, Bash, Docker, YAML/Markdown docs. Vikunja 
    REST API, Anthropic Claude API, OpenClaw skills.   Obsidian for knowledge 
    store.
  testing_requirements: Validate all docs via validate_docs.py (frontmatter + 
    secret scan) in CI. Python scripts must be tested   manually before merge. 
    Add pytest coverage for any non-trivial Python modules as they emerge. No 
    fixed       coverage target yet.
  quality_gates: 'CI validation passes (validate_docs.py: frontmatter compliance +
    secret scan). PR required for all        changes to main. Self-review of diff
    before merge.'
  review_policy: Solo maintainer project. Self-review via PR diff before merge. 
    Use Claude Code or Claude Desktop as       architectural review partner when
    changes touch the v0.3 spec or cross-cutting concerns.
  performance_targets: Inbox processing completes within 60 seconds of trigger. 
    WhatsApp command responses within 10 seconds.    CI validation under 30 
    seconds. Heartbeat schedules fire on time.
  deployment_constraints: Production services run on office2 (Ubuntu 24.04 LTS).
    Mac is authoring only. All scripts and configs     target Linux unless 
    explicitly noted. Services accessible via Tailscale only — never exposed to 
    public     internet.
  documentation_policy: All markdown files require YAML frontmatter (title, 
    doc_type, status). Architecture decisions live in     docs/design/. Feature 
    specs in docs/func-spec/ before implementation. Conventional commits (feat:,
    fix:,   docs:, chore:, ci:). Update docs when behavior changes.
  risk_boundaries: 02-Growth/_private/ is never read, written, or referenced by 
    any agent or script — no exceptions. No      credentials in code or 
    committed files. Anthropic API called direct — no third-party proxies. No 
    community   OpenClaw skills without source review. All services 
    Tailscale-only. No untrusted code executes near          credentials or 
    personal data.
  amendment_process: Edit constitution.md directly, run spec-kitty constitution 
    sync, commit via PR. Review diff to confirm    derived files reflect intent 
    before merge.
  exception_policy: Exceptions documented in PR description with rationale, 
    scope, and expiration. No permanent exceptions    to privacy or security 
    boundaries.
selected_paradigms:
- docs-first
- spec-driven
selected_directives:
- DOCS_FIRST
- SPEC_BEFORE_CODE
available_tools:
- git
- python
- pip
- bash
- docker
- docker-compose
- ssh
- systemctl
- spec-kitty
- validate_docs.py
- gh
- curl
- tailscale
