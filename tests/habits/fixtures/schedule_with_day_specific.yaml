# Fixture schedule for mission #408 / WP-01 tests.
#
# Mixes daily and day-specific habits to exercise the day-of-week filter
# and the schedule_loader validation paths. Independent of the production
# phase3-schedule.yaml.

mission_id: "test-mission-fixture"

operations: []

habits:
  - task_id: 100
    title: "Daily wake habit (fixture)"
    rrule: "FREQ=DAILY;INTERVAL=1"
  - task_id: 200
    title: "Wednesday-only strength (fixture)"
    designated_weekdays: ["Wed"]
    rrule: "FREQ=WEEKLY;BYDAY=WE"
  - task_id: 201
    title: "Multi-day Mon+Thu (fixture)"
    designated_weekdays: ["Mon", "Thu"]
    rrule: "FREQ=WEEKLY;BYDAY=MO,TH"
  - task_id: 300
    title: "Daily meditate (fixture)"
    rrule: "FREQ=DAILY;INTERVAL=1"
