notes: |
  Syncs the updated security-monitor audit.sh to its standalone office2 copy
  (/data/services/security-monitor/scripts/audit.sh) for kentonium3/kg-automation#862.

  #862 fixes a false-page race: an audited-surface deploy that lands within seconds of
  a security-monitor audit tick fires a false `error` push for drift that felix-deployer
  has already flagged as expected and is actively rebaselining. audit.sh now consults a
  new checkout-resident helper (scripts/deploy/felix-deployer/expected_drift.py) at PUSH
  time and withholds the push for baseline drift named in felix-deployer's fresh
  pending-rebaseline token — WITHOUT changing detection (every drift still emits its
  `[ALERT]` line and the run still exits 1, so felix-deployer's reconcile still detects
  the drift and stamps the baseline). Unexpected drift and IOC alerts always push.
  Fail-safe: any helper error → empty list → the audit pages exactly as before.

  The helper (expected_drift.py) is checkout-resident and arrives on office2 via
  felix-deployer's own self-pull in the same tick that applies this manifest; only the
  standalone audit.sh copy needs an explicit sync, which this entrypoint performs.

  Tier 3 (a file copy into a claude-owned dir — no sudo, no Tier 0/1/2 action).
  audited_surface: false — audit.sh (scripts/office2/security-monitor/*.sh) matches no
  audited-surfaces.json pattern (systemd-user-units covers scripts/office2/*.service and
  scripts/office2/deploy/*.sh, not security-monitor/audit.sh); no hashed baseline drifts.
  Rebaseline: not required.
