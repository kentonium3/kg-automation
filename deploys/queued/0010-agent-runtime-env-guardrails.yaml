notes: |
  Tier 3 (#658). Redeploys the runtime-env-hardened Felix agent prompts
  (capture/habits/escalation/tasker/calendar + their .tmpl sources) to office2.

  Entrypoint scripts/deploy/redeploy-agent-prompts-658.py is a thin, stdlib-only
  wrapper: it self-bootstraps sys.path with the __file__-anchored repo root and
  chdirs there (so it is itself free of the runtime-env-assumption bug), then
  delegates to scripts.openclaw.deploy.deploy_agent_prompts (WP01/#567) for a
  full-fleet MD5-diff sync. felix-deployer runs it as `--dry-run` then `--apply`.

  Verification: pre runs a full-fleet drift dry-run (exit 0). post runs the SC-004
  capture health check `python3 -m scripts.inbox.prescan --self-check` under the
  canonical PYTHONPATH-anchored form (from repo root and from /tmp) proving the
  converted invocation resolves cwd-independently. habits/escalation/tasker/calendar
  cron health verifies on their next scheduled runs. PYTHONPATH is exported from
  `git rev-parse --show-toplevel` because felix-deployer.service sets no PYTHONPATH;
  no checkout path is hardcoded.

  Rebaseline: NOT required. Agent prompts are a listed audited surface
  (audited-surfaces.json id=openclaw-agent-prompts) but an UNMONITORED one — audit.sh
  hashes only openclaw.json, not deployed AGENTS.md (gap #621, confirmed #325/#656);
  affected_baselines=[] and rebaseline_required=false, so no baseline covers agent-prompt
  content and none can be reset. The entrypoint is top-level, outside the audited
  scripts/deploy/lib/** pipeline glob. The merge records `Rebaseline: not required —
  agent prompts are an unmonitored audited surface (#621)`. (audited_surface: true only
  records that the deploy touches listed audited paths.)

  No native OpenClaw element is touched (prompts only): no ~/.openclaw, openclaw.json,
  or openclaw-gateway.service edit. Architecture affirm (change class
  agent-prompt-changed): service-inventory.json and network-topology.json need NO
  change (no new/removed service, port, credential, or data flow).
