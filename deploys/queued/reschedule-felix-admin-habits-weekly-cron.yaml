tier: 3
entrypoint: scripts/deploy/reschedule-felix-admin-habits-weekly-cron.py
audited_surface: false
verification:
  pre:
    - "openclaw cron list --json | python3 -c 'import json,sys; jobs=json.load(sys.stdin)[\"jobs\"]; names=[j[\"name\"] for j in jobs]; assert \"habits-weekly-report\" in names, f\"habits-weekly-report not registered (have {names})\"; print(\"pre-check ok\")'"
  post:
    - "openclaw cron list --json | python3 -c 'import json,sys; jobs=json.load(sys.stdin)[\"jobs\"]; m=[j for j in jobs if j[\"name\"]==\"habits-weekly-report\"][0]; assert m[\"schedule\"][\"expr\"]==\"0 6 * * 1\", f\"schedule still {m[\\\"schedule\\\"][\\\"expr\\\"]!r}\"; print(\"post-check ok: schedule=\\\"0 6 * * 1\\\"\")'"
created_at: "2026-06-16T19:30:00Z"
created_by: trustworthy-weekly-habit-report-01KV4GZ7
notes: |
  Move the felix-admin-habits weekly cron from Sunday 22:00 ET (0 22 * * 0)
  to Monday 06:00 ET (0 6 * * 1) so the reporting window closes before the
  helper runs (kentonium3/kg-automation#605, FR-001).

  The cron string is openclaw-local; openclaw does not accept a per-job TZ
  field, so the schedule must be expressed in office2's host timezone
  (America/New_York). The entrypoint script is a thin wrapper over
  scripts/deploy/lib/cron.openclaw_cron_edit — all idempotency and
  NOT_FOUND refusal lives in the library primitive.

  Tier 3 (Standard / cron edit on an existing job) per
  docs/design/architecture/data/change-risk-taxonomy.json. No audited
  surface touched (the AGENTS.md edit lives in WP04's commit; this
  manifest only changes the schedule string).

  Companion changes in the same mission:
    - WP04: AGENTS.md weekly section updated to match this schedule.
    - WP06: architecture docs reflect the new cron in
      docs/design/architecture/service-inventory.md +
      docs/design/architecture/data/service-inventory.json.
