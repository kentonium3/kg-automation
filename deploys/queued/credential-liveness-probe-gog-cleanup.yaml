schema_version: v1
name: credential-liveness-probe-gog-cleanup
issue: kentonium3/kg-automation#846
tier: 3
entrypoint: scripts/deploy/deploy-credential-liveness-probe-gog-cleanup.sh
audited_surface: true
verification:
  pre:
  - test -f scripts/office2/credential-liveness-probe.service
  - test -f scripts/office2/credential-liveness-probe.timer
  post:
  - test -f /home/claude/.config/systemd/user/credential-liveness-probe.service
  - '! grep -qE "GOG_KEYRING_BACKEND|openclaw-gateway[.]env" /home/claude/.config/systemd/user/credential-liveness-probe.service'
  - systemctl --user is-active credential-liveness-probe.timer
created_at: '2026-07-22T23:15:00Z'
created_by: felix-dev-autopilot-846
notes: |
  Follow-up cleanup from #845 (MED-3). Re-installs the cleaned
  credential-liveness-probe.service (+ .timer, unchanged) into
  ~/.config/systemd/user/ so the running unit drops the gog-era env coupling
  (Environment=GOG_KEYRING_BACKEND=file + EnvironmentFile=openclaw-gateway.env).
  The paired repo change also removes the gog-binary + gateway-env prechecks from
  the operator deploy script credential-liveness-probe.sh. The runner has been
  credential-generic since #845 (subject: felix-google-personal-calendar via
  calendar_helper --self-check); the sole manifest liveness_probe (calendar)
  needs none of gog / GOG_KEYRING_BACKEND / openclaw-gateway.env.

  Removal is safe though openclaw-gateway.env also exported VIKUNJA_BASE_URL
  (renata LOW-2): this service runs --liveness-only, whose alert path files a
  GitHub issue via the gh CLI and skips the Vikunja/cadence block, so
  VIKUNJA_BASE_URL is never resolved; and vikunja_config falls back to
  /data/services/openclaw/config/vikunja-base-url.txt anyway (the sibling
  credential-health-check.service already runs with no EnvironmentFile). The
  After=openclaw-gateway.service ordering line is intentionally RETAINED
  (ordering-only, mirrors the sibling); #846 scope is the two env lines only.

  Tier 3 (systemd user timer content edit; no Tier 0/1/2 action); oneshot fired
  by a 6h timer, so daemon-reload + enable --now is non-disruptive.
  audited_surface: true — the unit-content change drifts
  systemd-user-unit-contents; felix-deployer's deferred-confirm auto-rebaseline
  fires off the repo-file signal (scripts/office2/*.service +
  scripts/office2/deploy/*.sh), no manual reset. Rollback: re-add the two lines
  and re-run this entrypoint.
