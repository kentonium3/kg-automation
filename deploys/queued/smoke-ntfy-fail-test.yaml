notes: |
  Deliberate-failure smoke test for the new ntfy.sh substrate (#595).
  The entrypoint exits 0 on --dry-run and exits 1 on --apply, forcing the
  applier into the failure path so notify.py dispatches an ntfy push to
  the operator's phone (topic: FELIX_DEPLOYER_NTFY_TOPIC on office2).
  Expected outcome:
    - manifest moves from deploys/queued/ to deploys/failed/<name>-<ts>.yaml
    - operator's ntfy phone app shows a push with title
      "felix-deployer failed: smoke-ntfy-fail-test"
    - applier tick exits 0 (failure-isolation invariant holds)
  Cleanup after verification: rm scripts/deploy/smoke-ntfy-fail.sh and
  the failure record under deploys/failed/ in a follow-up commit.
