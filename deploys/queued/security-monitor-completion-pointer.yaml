schema_version: v1
name: security-monitor-completion-pointer
issue: kentonium3/kg-automation#891
tier: 3
entrypoint: scripts/deploy/deploy-security-monitor-audit.py
audited_surface: false
created_at: '2026-08-27T22:30:00Z'
created_by: fix-891-canary-checks-that-cannot-fail
apply_mode: manifest
notes: |
  Syncs the updated security-monitor audit.sh to its standalone office2 copy
  (/data/services/security-monitor/scripts/audit.sh) for #891.

  audit.sh now writes a completion pointer to
  /data/services/security-monitor/state/last-tick.json on both exit branches,
  plus an EXIT trap recording exit_status=failure on abnormal termination. The
  canary's inventory entry is repointed to method: state-file in the same
  commit.

  REQUIRED, NOT SUFFICIENT. The inventory half reaches office2 on its own via
  the checkout fast-forward; the standalone audit.sh copy does not, so without
  this manifest the canary aims at a path nothing will ever write.

  This manifest copies audit.sh; it does not run it (the entrypoint is the
  canonical syncer for every future change, and running an audit as a deploy
  side effect can push drift alerts). audit.sh creates STATE_DIR itself, so the
  pointer first appears at the next scheduled run, 0 3 * * * UTC.

  THE WINDOW. Until that run the pointer is absent: read_state raises, the
  probe is unevaluable, the component reads unknown. First sighting is silent
  (emit_on_first_seen=False for unknown) but dedup re-emits every 6h, so a
  merge just after 03:00 UTC would page 3-4 times. Do not rely on merge timing.
  Run this immediately after apply to close the window:

    ssh office2-claude 'sg docker -c /data/services/security-monitor/scripts/audit.sh'
    ssh office2-claude 'cat /data/services/security-monitor/state/last-tick.json'

  Non-destructive when baselines exist. If the pointer is absent after that
  run, investigate — the canary will page every 6h.

  exit_status means "ran to completion", NOT "no drift" — drift already pushes
  from audit.sh, and a #862 suppressed rebaseline exits 1 without pushing.
  Counts ride in alert_count/pushed_count, outside the error vocabulary.

  Tier 3 (file copy into a claude-owned dir; no sudo). audited_surface: false —
  scripts/office2/security-monitor/*.sh matches no audited-surfaces.json
  pattern. Rebaseline: not required.
