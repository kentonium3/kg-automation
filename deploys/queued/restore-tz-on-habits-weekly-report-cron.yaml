schema_version: v1
name: restore-tz-on-habits-weekly-report-cron
mission_slug: trustworthy-weekly-habit-report-01KV4GZ7
tier: 3
entrypoint: scripts/deploy/restore-tz-on-habits-weekly-report-cron.py
audited_surface: false
verification:
  pre:
    - "openclaw cron list --json | python3 -c 'import json,sys; jobs=json.load(sys.stdin)[\"jobs\"]; names=[j[\"name\"] for j in jobs]; assert \"habits-weekly-report\" in names, f\"habits-weekly-report not registered (have {names})\"; print(\"pre-check ok\")'"
  post:
    - "openclaw cron list --json | python3 -c 'import json,sys; jobs=json.load(sys.stdin)[\"jobs\"]; m=[j for j in jobs if j[\"name\"]==\"habits-weekly-report\"][0]; tz=m[\"schedule\"].get(\"tz\"); expr=m[\"schedule\"][\"expr\"]; assert tz==\"America/New_York\", f\"tz still {tz!r}\"; assert expr==\"0 6 * * 1\", f\"expr drifted to {expr!r}\"; print(\"post-check ok: tz=America/New_York, expr=0 6 * * 1\")'"
created_at: "2026-06-16T21:25:00Z"
created_by: trustworthy-weekly-habit-report-01KV4GZ7-followup
notes: |
  Restore the America/New_York timezone on the felix-admin-habits weekly
  cron (habits-weekly-report).

  Sibling deploy 'reschedule-felix-admin-habits-weekly-cron' (applied at
  commit 7eba774b) successfully changed the cron expression from
  '0 22 * * 0' to '0 6 * * 1', but its 'openclaw cron edit <id> --cron
  <expr>' call (without an accompanying --tz) reset the cron's timezone
  to openclaw's default (UTC). Symptom: the cron now fires at Mon 06:00
  UTC = Mon 02:00 ET, four hours earlier than the intended Mon 06:00 ET.

  This manifest patches just the tz field via 'openclaw cron edit <id>
  --tz America/New_York'. The cron expression is left alone — openclaw
  accepts a tz-only edit as idempotent at the openclaw layer.

  Verification:
    pre  — habits-weekly-report cron is registered.
    post — schedule.tz == 'America/New_York' AND schedule.expr remains
           '0 6 * * 1' (catches any unintended expr drift).

  Tier 3 (Standard / cron edit on an existing job). No audited surface
  touched. Companion changes in the same mission already landed:
    - WP04: AGENTS.md weekly section.
    - WP06: architecture docs.
  This deploy completes the deploy-side of mission
  trustworthy-weekly-habit-report-01KV4GZ7 (#605).
