notes: |
  Ships the Felix WhatsApp time-logging Sheets helper to office2 (#703).

  Tier 2 (touches the felix-personal Google OAuth credential scope — the
  personal token is re-minted with the added `spreadsheets` scope alongside
  the existing `calendar.events` scope from #699) + Tier 3 (installs a
  deterministic Python helper). audited_surface: false — main's AGENTS.md
  recognizer addition is an UNMONITORED audited surface (gap #621) and
  scripts/google/** here is not a hashed baseline; no rebaseline required.

  Entrypoint reuses the #699 calendar-helper's shared uv venv at
  /data/services/openclaw/felix-calendar/venv (same google client libs)
  rather than provisioning a second venv.

  TWO MANDATORY OPERATOR PRECONDITIONS (Kent-in-the-loop, NOT automated —
  presence-checked only; see docs/runbooks/timelog.md):
    1. Sheets-scope re-consent — `personal` token re-minted with combined
       `calendar + spreadsheets` scopes (browser OAuth, only Kent), staged
       at ~/.config/felix/google/personal/{client_secret,token}.json (0600).
    2. One-time workbook bootstrap — Felix-owned time-tracking workbook
       created, id recorded at ~/.config/felix/timelog/workbook.json (0600).

  This manifest re-attempts every ~5-min tick until BOTH preconditions are
  completed. Halt-on-error order: (1) venv/deps gate; (2) creds + workbook
  presence; (3) no-emit dry-run self-test (sheets_helper --self-check +
  timelog against an unresolvable client, gated before go-live, #711);
  (4) prompt-sync trigger + verify main's recognizer; (5) report via #701.
