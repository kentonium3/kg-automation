schema_version: v1
name: gateway-pythonpath-dropin
mission_slug: felix-admin-cron-path-fix-01KWQTY3
tier: 1
entrypoint: scripts/deploy/install-gateway-pythonpath-dropin.py
audited_surface: true
verification:
  pre:
  - systemctl --user is-active openclaw-gateway.service
  post:
  - "systemctl --user show openclaw-gateway.service -p Environment | grep\
    \ 'PYTHONPATH=/home/claude/kg-automation'"
  - "MAINPID=$(systemctl --user show -p MainPID --value openclaw-gateway.service)\
    \ && [ -n \"$MAINPID\" ] && [ \"$MAINPID\" != \"0\" ]\
    \ && tr '\\0' '\\n' < /proc/$MAINPID/environ\
    \ | grep -qx 'PYTHONPATH=/home/claude/kg-automation'\
    \ && echo \"SC-10b ok: PYTHONPATH=/home/claude/kg-automation confirmed in\
    \ /proc/$MAINPID/environ (live gateway process env)\""
created_at: '2026-07-05T02:30:00Z'
created_by: felix-admin-cron-path-fix-01KWQTY3
notes: "Ships FR-001/FR-002 from kentonium3/kg-automation#656: export\n\
  PYTHONPATH=/home/claude/kg-automation into the openclaw-gateway.service process\n\
  environment via a systemd drop-in.\n\n\
  The base unit (scripts/openclaw/openclaw-gateway.service) is NOT edited;\n\
  this manifest installs a drop-in at\n\
  ~/.config/systemd/user/openclaw-gateway.service.d/pythonpath.conf\n\
  so the change composes with #653's in-flight ExecStart relocation.\n\n\
  PYTHONPATH propagates to all agent subprocesses (Node child_process inherits\n\
  process.env), making 'python3 -m scripts.*' resolve from any working directory\n\
  fleet-wide. This moves the cwd-import invariant from the stochastic layer\n\
  (LLM prompt adherence) to the deterministic layer (process environment).\n\n\
  Tier 1 (Connectivity/Fabric): gateway restart briefly disconnects all agents;\n\
  verify gateway returns healthy before declaring success.\n\n\
  audited_surface: true — systemd user unit drop-in is an audited surface per\n\
  docs/design/architecture/data/audited-surfaces.json. Rebaseline obligation\n\
  is recorded in WP06.\n\n\
  SC-10 verification gates:\n\
  (a) systemctl --user show ... -p Environment (declared-value sanity):\n\
      confirms the unit definition carries the expected value.\n\
  (b) /proc/<MainPID>/environ (live-process gate): reads the running gateway\n\
      process's own environment and asserts the exact PYTHONPATH entry.\n\
      The gateway is a systemctl --user service; its Node child_process\n\
      subprocesses (agent tool calls) inherit process.env. This proves the\n\
      running gateway actually carries PYTHONPATH, not just that the unit\n\
      declares it. This is the deterministic automated gate.\n\
  The DEFINITIVE real-agent confirmation is the operator's post-deploy step:\n\
  run an actual felix-admin cron job (openclaw cron runs showing status=success\n\
  with no ModuleNotFoundError). That step is documented in quickstart.md\n\
  SC-1/SC-2 and is intentionally outside this automated gate.\n\n\
  Decision: DM 01KWR0CRKY6G91P715GD375YKC.\n"
