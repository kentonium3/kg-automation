- docker-images.txt
verification:
  pre:
  - scripts/deploy/deploy-vikunja-release-stage.py --dry-run
  post:
  - "docker image inspect --format '{{.Id}}' office2.local/vikunja:v2.7.1-670-420c7bcb75 | grep -qx sha256:35e1bc8790292deedf2addc3f3f196e38d84c2614219a95d6ef711c1f02afba5"
  - "docker image inspect --format '{{.Id}}' vikunja/vikunja:2.4.0 | grep -qx sha256:60fe1ee8f729c17b057ba00a49b968adb4ed1e774cea36b5f4cc81340991a7d2"
created_at: '2026-10-30T12:00:00Z'
created_by: claude-code-1087
notes: '#1087 STAGE. Loads the reviewed Vikunja release archive (services/vikunja/release.json)
  into the local Docker store and verifies it. Inert: it never touches a container or the
  Compose file, and the running service stays on vikunja/vikunja:2.4.0.


  Order (R-18): classic-store preflight, archive size and sha256, offline OCI chain, then
  docker load; the loaded ID must equal the config digest 35e1bc87 and the image facts must
  match the record; only then tag office2.local/vikunja:v2.7.1-670-420c7bcb75. The
  office2.local/vikunja:active tag is created at 60fe1ee8 (2.4.0) only if absent and no
  activation marker exists (R-23); an existing active is never retagged. Re-apply is a no-op.


  Refusals exit 1 before any load or tag: archive missing, size or sha mismatch, release tag
  pointing elsewhere, active unexpected or held by an activation, rollback image absent,
  unsupported store.


  Tier 2 for the Docker image store. audited_surface: true with expected_baselines
  docker-images.txt, since new image tags drift that baseline.


  Recovery if STAGE_VERIFY_FAILED reports a loaded ID: the image is untagged; the agent runs
  docker image rm <id> through office2-claude, then a manual rebaseline of docker-images.txt.


  Rollback: docker image rm office2.local/vikunja:v2.7.1-670-420c7bcb75 (the tag only) and
  revert the merge. Keep active and vikunja/vikunja:2.4.0.'
