schema_version: v1
name: migrate-inbox-state-and-logs
mission_slug: felix-admin-cron-path-fix-01KWQTY3
tier: 2
entrypoint: scripts/deploy/migrate-inbox-state-and-logs.py
audited_surface: false
verification:
  pre:
  - python3 -m scripts.deploy.lib.snapshot verify_restic_recent
  post:
  - test -s /data/services/openclaw/state/inbox-routing.jsonl
  - >-
    python3 -c
    'import os,stat,pwd,grp; p="/data/services/openclaw/state";
    s=os.stat(p); u=pwd.getpwuid(s.st_uid).pw_name; g=grp.getgrgid(s.st_gid).gr_name;
    m=stat.S_IMODE(s.st_mode);
    assert u=="claude",f"dir owner {u} != claude";
    assert g=="secondbrain",f"dir group {g} != secondbrain";
    assert m==0o750,f"dir mode {oct(m)} != 0750";
    print("state dir ok:", u, g, oct(m))'
  - >-
    python3 -c
    'import os,stat,pwd,grp; p="/data/services/openclaw/state/inbox-routing.jsonl";
    s=os.stat(p); u=pwd.getpwuid(s.st_uid).pw_name; g=grp.getgrgid(s.st_gid).gr_name;
    m=stat.S_IMODE(s.st_mode);
    assert u=="claude",f"file owner {u} != claude";
    assert g=="secondbrain",f"file group {g} != secondbrain";
    assert m==0o640,f"file mode {oct(m)} != 0640";
    print("state file ok:", u, g, oct(m))'
  - >-
    python3 -c
    'import glob; d="/home/kgale/second-brain/agents/logs";
    logs=glob.glob(d+"/inbox-prescan-*.md");
    assert logs,f"No inbox-prescan-*.md found in {d} — inbox forensic logs not preserved";
    print(f"Vault inbox logs ok: {len(logs)} file(s) present")'
notes: |
  One-time Tier-2 data migration — narrowed scope (FR-008/SC-5;
  kentonium3/kg-automation#656). Full decommission of /home/claude/second-brain
  is deferred to #659 (observation-digest subsystem still active there).

  Migrates:
    - Inbox dedup ledger + pending-calendar-clarifications state files from
      /home/claude/second-brain/agents/state/ to the canonical
      /data/services/openclaw/state/ (claude:secondbrain 0640, dir 0750).
    - Top-level inbox forensic logs (inbox-prescan-*.md only) to
      /home/kgale/second-brain/agents/logs/ (skip-if-exists).

  Per-agent observation subdirs (enrichment/, felix-admin-*, …) are NOT copied
  — they belong to the observation-digest subsystem and are handled by #659.
  The /home/claude/second-brain tree is LEFT IN PLACE by this migration.

  Safety:
    - Tier-2 snapshot gate: refuses without Restic snapshot <=24h (C-003).
    - Atomic copy-before-cutover: state files at target before WP02/WP03
      repointed readers rely on the new path (H1 ordering guarantee).
    - Idempotent: second run is a safe no-op.
    - Convergent: ownership and mode always enforced on target dir/files,
      including pre-existing targets from a partial prior run (FR-012).
    - Union-merge for divergent JSONL ledger; conflict-abort for non-JSONL.
    - --dry-run prints the full plan and mutates nothing.

  Post-checks verify:
    - State file exists and is non-empty.
    - State dir owner=claude, group=secondbrain, mode=0750.
    - State file owner=claude, group=secondbrain, mode=0640.
    - At least one inbox-prescan-*.md present in vault (forensic logs preserved).

  Depends on WP02 (scripts/inbox/*.py repoint) and WP03 (agent prompt
  log-path fix) being deployed first so code readers already point at
  /data/services/openclaw/state/ before this manifest runs.
