# Deploy manifest for agent-skill-sync (#775) — the OpenClaw skills deploy/sync
# mechanism (sibling to agent-prompt-sync #567). felix-deployer applies this from
# deploys/queued/ within ~5 min of the merge landing on main: it advances the
# checkout (so the helper + units + entrypoint are present), then runs the
# entrypoint, which is a HARD verify-before-enable gate — a failed smoke/enable
# fails the deploy loudly (Codex #1 HIGH-1).
#
# Audited surface: the new systemd user units + this deploy script. WP04 extends
# audited-surfaces.json globs to cover them; on the felix-deployer happy path the
# auto-rebaseline (#685 watermark) covers the change and the merge records the
# rebaseline outcome (C-002).
schema_version: v1
name: skills-sync
mission_slug: openclaw-skills-sync-01KXW1DQ
tier: 3
entrypoint: scripts/deploy/deploy-skills-sync.sh
audited_surface: true
verification:
  pre:
    - test -f scripts/openclaw/deploy/deploy_agent_skills.py
    - test -f scripts/openclaw/deploy/agent-skill-sync.service
    - test -f scripts/openclaw/deploy/agent-skill-sync.timer
    - test -d scripts/openclaw/skills
  post:
    - test -f /home/claude/.config/systemd/user/agent-skill-sync.service
    - test -f /home/claude/.config/systemd/user/agent-skill-sync.timer
    - test -f /data/services/openclaw/deploy/skills-last-tick.json
created_at: '2026-07-19T00:00:00Z'
created_by: openclaw-skills-sync-01KXW1DQ
notes: >
  Sibling to agent-prompt-sync. The entrypoint places the units, runs a real-unit
  smoke that asserts the freshness signal skills-last-tick.json was written, then
  enable --now + asserts is-enabled/list-timers (XDG_RUNTIME_DIR exported). No
  sudo (Tier-0 discipline). Rollback: systemctl --user disable --now
  agent-skill-sync.timer; rm the units; daemon-reload.
