schema_version: v1
name: felix-vikunja-sync-unit-reconcile
issue: kentonium3/kg-automation#925
tier: 3
entrypoint: scripts/deploy/deploy-felix-vikunja-sync-units.py
audited_surface: true
verification:
  pre:
  - test -f scripts/sync/systemd/felix-vikunja-sync.timer
  - test -f scripts/sync/systemd/felix-vikunja-sync.service
  post:
  - systemctl --user is-active felix-vikunja-sync.timer
  - test -n "$(systemctl --user show felix-vikunja-sync.timer -p NextElapseUSecMonotonic --value)"
  - diff -q scripts/sync/systemd/felix-vikunja-sync.timer "$HOME/.config/systemd/user/felix-vikunja-sync.timer"
  - diff -q scripts/sync/systemd/felix-vikunja-sync.service "$HOME/.config/systemd/user/felix-vikunja-sync.service"
created_at: '2026-08-31T19:45:00Z'
created_by: operator-directed (felix-trust-scan/unit-drift alert, 2026-08-31T14:07:32Z)
notes: |
  Reconciles a repo-vs-deployed drift on both felix-vikunja-sync user units,
  reported by felix-trust-scan/unit-drift 2026-08-31 (warn).

  NO BEHAVIOUR CHANGE. Measured on office2 before writing this:

    .timer   - deployed carries Persistent=true; #925 removed it from the repo.
               INERT here. systemd.timer(5): "this setting only has an effect on
               timers configured with OnCalendar=". This timer is monotonic
               (OnUnitInactiveSec=300s); its only two OnCalendar occurrences are
               COMMENTS, confirmed by listing non-comment directives.
    .service - directives IDENTICAL; comment-only drift. The deployed comment
               still names the pre-#860 credential (vikunja-api) rather than the
               kent-owned vikunja-api-kent.

  WHY DEPLOY A NO-OP. Both drifts are text on the machine asserting something
  untrue of the machine. #925 was itself a fix for exactly that - a comment
  promising a catch-up tick systemd never provided - and it changed only the repo
  copy, queuing no manifest, so the misleading text stayed live while the repo
  read correctly. The fix was not finished until deployed. Leaving the warn also
  teaches the operator to ignore the scan that correctly caught it.

  CONVERGENCE IS THE DELIVERABLE. The entrypoint re-diffs both deployed units
  against the repo after copying and FAILS if either still differs, reporting
  verify_unreadable rather than success if it cannot read one back.

  Restarting the timer resets the monotonic cycle, moving the next tick by up to
  5 min - harmless at this cadence, and the driver is delta-based (updated_since).

  REBASELINE: this drifts systemd-user-unit-contents.txt, but both files are
  tracked in the repo, so the observe-range auto-rebaseline covers it.
  expected_baselines deliberately NOT declared - that is for runtime CLI
  mutations with no repo-file signal.

  Tier 3: user units under the claude account; no Tier 0/1/2 action.
