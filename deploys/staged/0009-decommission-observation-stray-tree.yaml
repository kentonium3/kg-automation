  2026-07-04. Then final union-merge under quiesce -> single root-level
  shutil.rmtree(/home/claude/second-brain) (no tree walk; _private removed with
  the tree but never read/logged) -> restart timer -> post-check tree absent.

  The manifest runs the entrypoint with only "--apply", so coverage check (a)
  must pass on office2. If Restic does not cover the tree the gate ABORTS
  (fail-safe); the operator then runs it manually after confirming a backup:
    python3 scripts/deploy/decommission-observation-stray-tree.py --apply --attest-backup-coverage

