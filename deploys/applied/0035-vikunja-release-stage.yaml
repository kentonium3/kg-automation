notes: 'STAGE for the repeat cutover to the published v2.8.0-rrule.2 (services/vikunja/release.json).
  Verifies the exact published archive bytes, loads the image and tags it. Inert:
  it starts no container, makes no ACTIVATE change, and the running service stays
  on v2.7.1-670-420c7bcb75 selected by office2.local/vikunja:active.


  Refusals exit before any load or tag: archive missing, size or sha mismatch, an
  embedded or release tag already pointing elsewhere, rollback image absent, unsupported
  store.


  The published archive carries the embedded tag kentonium3/vikunja:v2.8.0-rrule.2,
  so it appears after load. If a failure reports a loaded image, cleanup is tag-specific:
  remove only the tag, following the cutover runbook, and never delete by image ID.


  Tier 2 for the Docker image store. audited_surface true with expected_baselines
  docker-images.txt, since new image tags drift that baseline.


  Rollback: remove the release tag and the embedded tag only, then revert the merge.
  Keep office2.local/vikunja:active and office2.local/vikunja:v2.7.1-670-420c7bcb75.'
