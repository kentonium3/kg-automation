notes: 'Controlled operator bootstrap of the prompt-sync FETCH_HEAD race fix
  (kentonium3/kg-automation#667, mission prompt-sync-ff-race-01KX3SZC). Delivered
  by hand, NOT a queued manifest: the fixed code can only arrive via the
  checkout''s own git pull, which is the exact broken path being repaired, so a
  self-pull rollout is unsound (research D6). Manual sequence run on office2 as
  claude (quickstart.md is authoritative):

  1. Merge the mission to main.

  2. Stop both timers so no tick races the bootstrap: systemctl --user stop
  agent-prompt-sync.timer felix-deployer.timer.

  3. Manually fast-forward the shared checkout with the race-immune form: cd
  /home/claude/kg-automation && git fetch origin main && git merge --ff-only
  origin/main.

  4. Verify the new scripts/deploy/lib/{gitsync,deploylock,health}.py files and
  the modified actor tick bodies are present (ls + git log --oneline -1).

  5. Delete the stale origin lane branch (FR-003): git push origin --delete
  kitty/mission-trustworthy-weekly-habit-report-01KV4GZ7-lane-a — dead since the
  weekly-habit-report mission merged ~2026-06-16; it amplified the bare-fetch
  multi-head surface.

  6. Manual audited-surface rebaseline (out-of-band exception): the new
  scripts/deploy/lib/** files change a monitored surface. Confirm drift is
  expected-only FIRST, then reset per docs/runbooks/security-baseline-ops.md.
  Because this is an out-of-band manual bootstrap (not the felix-deployer happy
  path), the rebaseline is a manual reset, not an auto-rebaseline.

  7. Restart both timers: systemctl --user start agent-prompt-sync.timer
  felix-deployer.timer.

  Audited surface is specifically the new scripts/deploy/lib/** primitives (the
  deploy-pipeline registry matches scripts/deploy/lib/** + deploys/*.yaml); the
  actor edits to _tick.py / deploy_agent_prompts.py / notify.py are NOT
  registry-matched. No sudo required at any step; any sudo step would be handed
  to Kent per Tier-0 discipline.'
