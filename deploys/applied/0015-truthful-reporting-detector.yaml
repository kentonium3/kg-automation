notes: "Installs the felix-trust-scan systemd user timer (<=15min cadence) on\noffice2\
  \ (kentonium3/kg-automation#683, WP04). The timer runs\n`scripts.trust.run_trust_scan\
  \ --json` (timer mode, always exits 0 on\nfault; a fault surfaces as ok:false +\
  \ errors[] in the JSON, never a\nsystemd failed/restart loop).\n\nThe entrypoint\
  \ (scripts/deploy/deploy-truthful-reporting.py --apply):\n  1. installs felix-trust-scan.{service,timer}\
  \ into\n     ~/.config/systemd/user/;\n  2. runs `systemctl --user daemon-reload`\
  \ then\n     `systemctl --user enable --now felix-trust-scan.timer`;\n  3. runs\
  \ a preflight self-test\n     (`run_trust_scan --preflight --json`, may exit 2 on\
  \ a hard\n     scan-inability fault);\n  4. triggers `systemctl --user start agent-prompt-sync.service`\
  \ and\n     verifies the truthful-reporting doctrine (WP01) landed in the\n    \
  \ deployed main AGENTS.md, rather than waiting for the 5-min\n     prompt-sync timer;\n\
  \  5. reports the outcome via the #701 alert bus (no parallel channel).\n\nTier\
  \ 3 (Logic/Workflow \u2014 installs a user timer + runs a preflight\nself-test;\
  \ no Tier 0/1/2 action).\n\nRebaseline: not required \u2014 agent prompts are an\
  \ unmonitored audited\nsurface (gap #621: audit.sh does not hash deployed AGENTS.md,\
  \ so no\nbaseline is written for the WP01 doctrine change); the detector/systemd\n\
  code under scripts/trust/ and scripts/office2/ is not a hashed baseline\neither.\n"
