notes: '#1133 (mission crash-loop-unit-alerting-01M858E8). felix-canary gains a crash-loop
  stage that compares systemd and container restart counters across ticks. On 2026-11-23
  obsidian-sync.service restarted 39 times and nothing alerted: every point-in-time
  check saw active (running).


  The code reaches office2 with the checkout (the canary runs from it). The entrypoint
  starts felix-canary.service once and verifies the fresh artifacts check by check:
  crash-loop.json updated_at_utc is from this run; the canary ledger has crash-loop:system,
  crash-loop:user and crash-loop:container lines from this run, each healthy (every
  scope read completely); last-tick.json is fresh with no crash_loop error; any crash-loop
  event from this run was delivered. If the start joined a timer pass that began before
  the apply, it starts the unit once more; still stale is a failure.


  The first tick only records baselines: obsidian-sync''s 39 is a baseline, not an
  alert. A delivered crash-loop alert at apply would still be a successful deploy.


  Tier 3. audited_surface: true because this manifest matches the deploy-pipeline
  surface (deploys/queued/*.yaml), which has no affected_baselines and no hashed file
  drifts, so the expected rebaseline outcome is a clean reconciliation: pending_clean,
  then cleared_clean on a later tick; the applied record may only show pending_clean.


  Rollback: revert the merge. The canary then runs without the stage and crash-loop.json
  is inert; it can be moved aside to /data/services/felix-canary/state/retired/.'
