audited_surface: true
verification:
  pre:
  - test -f scripts/deploy/felix-deployer/deployer.py
  post:
  - systemctl --user is-active felix-deployer.timer
  - test -f /home/claude/.config/systemd/user/felix-deployer.service
notes: 'Bootstrap re-apply of felix-deployer with the ntfy.sh substrate fix

  (kentonium3/kg-automation#595). Supersedes

  deploys/applied/0001-bootstrap-felix-deployer.yaml, which records the

  original partial-applied state when step 5 (openclaw cron registration

  with non-existent flags) failed. The original 0001 entry is preserved

  verbatim as the historical record of the broken-bootstrap event.


  This v2 bootstrap is the first successful clean apply of felix-deployer

  with the ntfy.sh failure-notification substrate. ntfy topic provisioning

  (FELIX_DEPLOYER_NTFY_TOPIC env var via /home/claude/.config/felix-deployer/env)

  is operator-driven, NOT part of this bootstrap.


  ⚠ DO NOT COPY THIS verification BLOCK FOR ROUTINE QUEUED DEPLOYS. The

  patterns `ssh office2-claude ''…''` (used here in some earlier drafts and

  in older verification commands) work only because this bootstrap was

  operator-run from Mac, where the `office2-claude` SSH host alias is

  defined in ~/.ssh/config. Routine queued deploys are applied by

  felix-deployer running ON office2 itself, where that alias does not

  exist — loopback SSH fails with "Could not resolve hostname

  office2-claude". For routine deploys, write verification commands as

  local commands (no ssh wrapper). See the verification-commands callout

  in docs/runbooks/deploy/discipline.md and kentonium3/kg-automation#612.

  '
