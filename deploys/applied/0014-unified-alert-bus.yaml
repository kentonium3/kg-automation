notes: "Ships the unified felix-alert bus to office2 (kentonium3/kg-automation#701).\n\
  Tier 3 (Python library + bash shim + migrated emitters). Code reaches office2\n\
  via felix-deployer's `git pull` on the applying tick (same path as 0009/0013);\n\
  this entrypoint does NOT rsync/copy code \u2014 it is a thin verify-only gate for\n\
  the runtime env wiring (D9).\n\nPREFLIGHT (pre + --dry-run): the topic env-file\n\
  /home/claude/.config/felix/alert-bus/env must be present. It is the\nfelix-alert-ntfy-topic\
  \ credential \u2014 a secret provisioned out-of-band, NEVER\ncommitted (template\
  \ scripts/common/alert_bus.env.sample = FELIX_ALERT_NTFY_TOPIC=\nplaceholder only).\
  \ Missing env-file => an emitter silently gets\nNTFY_MISSING_TOPIC (the CRITICAL\
  \ gap post-plan review caught); the preflight\nreports it instead of deploying a\
  \ broken bus.\n\nSELF-TEST (post + --apply): --apply runs the alert-bus self-test\
  \ (emits a known\ninfo alert; exits non-zero if not delivered) so a failed delivery\
  \ is a\nfelix-deployer FAILURE, not a false success. The entrypoint calls `python3\
  \ -m\nscripts.common.alert_bus self-test` directly (NOT via alert_bus.sh): the shim\n\
  always exits 0 (D10) and its docstring puts self-test exit-code semantics in\nthe\
  \ Python CLI, so running through the shim would mask a failure. Per-runtime\noperator/CI\
  \ self-tests (cron via the shim; systemd via a transient\n`systemd-run --user` honoring\
  \ the unit EnvironmentFile) are in ../quickstart.md.\n\nREBASELINE: this WP adds\
  \ EnvironmentFile= to three deployed systemd user units\nand edits scripts/office2/deploy/felix-health-check.sh.\
  \ felix-health-check\n.service + .sh match the systemd-user-units surface (auto-matched).\n\
  expected_baselines (enabled-services.txt / systemd-user-units.txt /\nsystemd-user-dropins.txt)\
  \ is a harmless superset so deferred-confirm treats\nunit-content drift as expected\
  \ (D \u2286 E). Units only re-drift when re-installed\n(separate operator re-run);\
  \ this code-only tick does not reinstall them. No\nservice/port/credential added\
  \ \u2014 arch data unchanged.\n"
