  \ the script NEVER copies\nsecrets); (4) self-check smoke (auth refresh + bounded\
  \ events.list) via the\nvenv python. verification.post re-runs the self-check as\
  \ the applier gate.\n\nHelper code reaches office2 via the checkout's git pull on\
  \ the felix-deployer\ntick after feat/felix-calendar-helper merges to main. Credentials\
  \ are staged\nmanually (scp from the Mac) BEFORE this deploy runs \u2014 see quickstart.md.\n"
