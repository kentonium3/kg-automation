schema_version: v1
name: credential-health-check-alert-bus-env
issue: kentonium3/kg-automation#852
tier: 3
entrypoint: scripts/deploy/deploy-credential-health-check-alert-bus-env.sh
audited_surface: true
verification:
  pre:
  - test -f scripts/office2/credential-health-check.service
  - grep -qE "^EnvironmentFile=-/home/claude/[.]config/felix/alert-bus/env" scripts/office2/credential-health-check.service
  post:
  - grep -qE "^EnvironmentFile=-/home/claude/[.]config/felix/alert-bus/env" /home/claude/.config/systemd/user/credential-health-check.service
  - systemctl --user is-active credential-health-check.timer
  - grep -qE "^FELIX_ALERT_NTFY_TOPIC=.+" /home/claude/.config/felix/alert-bus/env
created_at: '2026-07-23T10:10:00Z'
created_by: claude-code-852-part2
notes: "#852 Part 2 (ramping ntfy expiry-reminder ladder). The new reminder ladder\n\
  in scripts/security/credential_health_check/reminders.py pushes escalating\nntfy\
  \ alerts (30/14/7/3/1d then daily-once-overdue) through the unified\nfelix-alert\
  \ bus (#701). The bus only delivers when FELIX_ALERT_NTFY_TOPIC is\nset; credential-health-check.service\
  \ previously loaded no alert-bus env-file,\nso emit() would resolve NTFY_MISSING_TOPIC\
  \ and the ladder would never fire.\n\nThis re-installs credential-health-check.service\
  \ (+ .timer, unchanged) into\n~/.config/systemd/user/ with the added\n`EnvironmentFile=-/home/claude/.config/felix/alert-bus/env`\
  \ line (leading \"-\"\n= non-fatal if absent), matching every sibling bus-using\
  \ service\n(felix-health-check, felix-canary, agent-prompt-sync, ...). The env-file\
  \ is\nalready provisioned on office2 by the unified-alert-bus deploy (#701).\n\n\
  The Python reminder code itself rides the shared checkout self-pull (no copy\nstep);\
  \ only the systemd unit-content change needs this manifest. The reminder\nladder\
  \ writes its firing ledger to\n/data/services/openclaw/state/credential-health-check/rungs.jsonl\
  \ (created at\nruntime, parents=True; claude owns the state tree).\n\nTier 3 (systemd\
  \ user unit content edit; no Tier 0/1/2 action). oneshot fired\nby a daily timer,\
  \ so daemon-reload + enable --now is non-disruptive.\naudited_surface: true \u2014\
  \ the unit-content change drifts\nsystemd-user-unit-contents; felix-deployer's deferred-confirm\
  \ auto-rebaseline\nfires off the repo-file signal (scripts/office2/*.service), no\
  \ manual reset.\nRollback: remove the EnvironmentFile line and re-run this entrypoint.\n"
apply_mode: manifest
