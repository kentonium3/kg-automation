schema_version: v1
name: restore-tz-on-habits-weekly-report-cron
mission_slug: trustworthy-weekly-habit-report-01KV4GZ7
tier: 3
entrypoint: scripts/deploy/restore-tz-on-habits-weekly-report-cron.py
audited_surface: false
verification:
  pre:
  - openclaw cron list --json | python3 -c 'import json,sys; jobs=json.load(sys.stdin)["jobs"];
    names=[j["name"] for j in jobs]; assert "habits-weekly-report" in names, f"habits-weekly-report
    not registered (have {names})"; print("pre-check ok")'
  post:
  - 'openclaw cron list --json | python3 -c ''import json,sys; jobs=json.load(sys.stdin)["jobs"];
    m=[j for j in jobs if j["name"]=="habits-weekly-report"][0]; tz=m["schedule"].get("tz");
    expr=m["schedule"]["expr"]; assert tz=="America/New_York", f"tz still {tz!r}";
    assert expr=="0 6 * * 1", f"expr drifted to {expr!r}"; print("post-check ok: tz=America/New_York,
    expr=0 6 * * 1")'''
created_at: '2026-06-16T21:25:00Z'
created_by: trustworthy-weekly-habit-report-01KV4GZ7-followup
notes: "Restore the America/New_York timezone on the felix-admin-habits weekly\ncron\
  \ (habits-weekly-report).\n\nSibling deploy 'reschedule-felix-admin-habits-weekly-cron'\
  \ (applied at\ncommit 7eba774b) successfully changed the cron expression from\n\
  '0 22 * * 0' to '0 6 * * 1', but its 'openclaw cron edit <id> --cron\n<expr>' call\
  \ (without an accompanying --tz) reset the cron's timezone\nto openclaw's default\
  \ (UTC). Symptom: the cron now fires at Mon 06:00\nUTC = Mon 02:00 ET, four hours\
  \ earlier than the intended Mon 06:00 ET.\n\nThis manifest patches just the tz field\
  \ via 'openclaw cron edit <id>\n--tz America/New_York'. The cron expression is left\
  \ alone \u2014 openclaw\naccepts a tz-only edit as idempotent at the openclaw layer.\n\
  \nVerification:\n  pre  \u2014 habits-weekly-report cron is registered.\n  post\
  \ \u2014 schedule.tz == 'America/New_York' AND schedule.expr remains\n         '0\
  \ 6 * * 1' (catches any unintended expr drift).\n\nTier 3 (Standard / cron edit\
  \ on an existing job). No audited surface\ntouched. Companion changes in the same\
  \ mission already landed:\n  - WP04: AGENTS.md weekly section.\n  - WP06: architecture\
  \ docs.\nThis deploy completes the deploy-side of mission\ntrustworthy-weekly-habit-report-01KV4GZ7\
  \ (#605).\n"
apply_mode: manifest
applied_at: '2026-06-16T23:00:11Z'
