notes: 'Installs the backup-script drift comparator as a daily systemd user timer
  on

  office2 (kentonium3/kg-automation#903, WP03). Compares the repo copy

  scripts/office2/restic-backup.sh against the deployed

  /data/services/backup/scripts/backup.sh and writes

  /data/services/backup/drift/script-drift-last-tick.json.


  WHY DETECTION AND NOT DEPLOYMENT. The obvious fix for #903 -- let this pipeline

  install backup.sh -- is REJECTED. The applier runs as claude, so installing

  means writing /data/services/backup/scripts/, which holds the NOPASSWD sudo

  target backup.sh. A claude-writable directory on that path makes the grant

  equivalent to NOPASSWD: ALL. That was #899, a real privilege escalation fixed

  2026-08-27. Automating this deploy would reopen it to save one manual command.

  So the install stays privileged and manual, by decision, and this component

  makes divergence visible instead. It reads those paths and never writes them.


  FAIL CLOSED. An unreadable deployed copy reports inconclusive, never match. A

  comparator that reports agreement when it cannot see one side converts an

  unknown into a false assurance.


  EXPECTED FIRST RESULT: drift. This mission also changes the repo''s

  restic-backup.sh (#902), and the operator will not have installed it when this

  timer first runs. The comparator''s first real signal is about its own mission''s

  change; it clears when the operator installs.


  verification.post is declared even though the schema only requires it for

  Tier 1/2 -- without it a deploy that installs nothing still passes.


  REBASELINE: enabling the timer drifts systemd-user-units.txt and

  systemd-user-unit-contents.txt, but the unit files are tracked in the repo, so

  the observe-range auto-rebaseline covers them. expected_baselines is

  deliberately NOT declared -- that field is for runtime-CLI mutations with no

  repo-file signal. Precedent: applied/0020 and the #895 crontab-capture deploy.


  Tier 3 (installs a user timer + a stdlib helper; no Tier 0/1/2 action).

  '
