  refuses a missing entry, any tools.allow/alsoAllow, or a different tools.deny; writes
  a write-once recovery receipt and a 0600 openclaw.json copy in /data/services/felix-deployer/state/
  first; then checks read-back, the other entries'' and top-level tools sha256, the
  Gateway reload line and an unchanged gateway PID and start time. The snapshot gate
  (Restic <= 24 h) is the applier''s.


  Tier 2. expected_baselines openclaw-config.txt: the commit range changes no file
  on that surface, so the drift has no signal of its own.


