notes: "Tier 3 (#658). Redeploys the runtime-env-hardened Felix agent prompts\n(capture/habits/escalation/tasker/calendar\
  \ + their .tmpl sources) to office2.\n\nEntrypoint scripts/deploy/redeploy-agent-prompts-658.py\
  \ is a thin, stdlib-only\nwrapper: it self-bootstraps sys.path with the __file__-anchored\
  \ repo root and\nchdirs there (so it is itself free of the runtime-env-assumption\
  \ bug), then\ndelegates to scripts.openclaw.deploy.deploy_agent_prompts (WP01/#567)\
  \ for a\nfull-fleet MD5-diff sync. felix-deployer runs it as `--dry-run` then `--apply`.\n\
  \nVerification: pre runs a full-fleet drift dry-run (exit 0). post runs the SC-004\n\
  capture health check `python3 -m scripts.inbox.prescan --self-check` under the\n\
  canonical PYTHONPATH-anchored form (from repo root and from /tmp) proving the\n\
  converted invocation resolves cwd-independently. habits/escalation/tasker/calendar\n\
  cron health verifies on their next scheduled runs. PYTHONPATH is exported from\n\
  `git rev-parse --show-toplevel` because felix-deployer.service sets no PYTHONPATH;\n\
  no checkout path is hardcoded.\n\nRebaseline: NOT required. Agent prompts are a\
  \ listed audited surface\n(audited-surfaces.json id=openclaw-agent-prompts) but\
  \ an UNMONITORED one \u2014 audit.sh\nhashes only openclaw.json, not deployed AGENTS.md\
  \ (gap #621, confirmed #325/#656);\naffected_baselines=[] and rebaseline_required=false,\
  \ so no baseline covers agent-prompt\ncontent and none can be reset. The entrypoint\
  \ is top-level, outside the audited\nscripts/deploy/lib/** pipeline glob. The merge\
  \ records `Rebaseline: not required \u2014\nagent prompts are an unmonitored audited\
  \ surface (#621)`. (audited_surface: true only\nrecords that the deploy touches\
  \ listed audited paths.)\n\nNo native OpenClaw element is touched (prompts only):\
  \ no ~/.openclaw, openclaw.json,\nor openclaw-gateway.service edit. Architecture\
  \ affirm (change class\nagent-prompt-changed): service-inventory.json and network-topology.json\
  \ need NO\nchange (no new/removed service, port, credential, or data flow).\n"
