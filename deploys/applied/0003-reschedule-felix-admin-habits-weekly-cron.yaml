notes: "Move the felix-admin-habits weekly cron from Sunday 22:00 ET (0 22 * * 0)\n\
  to Monday 06:00 ET (0 6 * * 1) so the reporting window closes before the\nhelper\
  \ runs (kentonium3/kg-automation#605, FR-001).\n\nThe cron string is openclaw-local;\
  \ openclaw does not accept a per-job TZ\nfield, so the schedule must be expressed\
  \ in office2's host timezone\n(America/New_York). The entrypoint script is a thin\
  \ wrapper over\nscripts/deploy/lib/cron.openclaw_cron_edit \u2014 all idempotency\
  \ and\nNOT_FOUND refusal lives in the library primitive.\n\nTier 3 (Standard / cron\
  \ edit on an existing job) per\ndocs/design/architecture/data/change-risk-taxonomy.json.\
  \ No audited\nsurface touched (the AGENTS.md edit lives in WP04's commit; this\n\
  manifest only changes the schedule string).\n\nCompanion changes in the same mission:\n\
  \  - WP04: AGENTS.md weekly section updated to match this schedule.\n  - WP06: architecture\
  \ docs reflect the new cron in\n    docs/design/architecture/service-inventory.md\
  \ +\n    docs/design/architecture/data/service-inventory.json.\n"
