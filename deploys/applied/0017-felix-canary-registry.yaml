notes: "Installs the felix-canary component-health canary as a systemd user timer\
  \ (<=15min cadence) on office2 (kentonium3/kg-automation#327, WP06). The timer runs\
  \ `python3 -m scripts.canary.run --once`: one pass over service-inventory targets,\
  \ dedup, emit via the #701 bus, and write the tick-signal (last-tick.json, FR-010)\
  \ + per-component ledger.\n\nEntrypoint (deploy-felix-canary.py --apply): (1) install\
  \ felix-canary.service + felix-canary.timer + felix-canary-onfailure.service into\
  \ ~/.config/systemd/user/; (2) `systemctl --user daemon-reload`; (3) F9 verify-before-enable\
  \ gate \u2014 ALL before enable so a fresh deploy never pages on an unverified false-positive\
  \ (#711/#703): (a) assert the installed .service ExecStart is byte-identical to\
  \ `/usr/bin/python3 -m scripts.canary.run --once`; (b) `--self-check` must print\
  \ status=ok; (c) run the REAL unit once (`systemctl --user start felix-canary.service`)\
  \ and assert a fresh last-tick.json completed_at_utc + a ledger line under ledger/<today>.jsonl\
  \ \u2014 proving state + ledger write under systemd, which --dry-run cannot; (4)\
  \ only then `systemctl --user enable --now felix-canary.timer`; (5) report via the\
  \ #701 bus.\n\nOnFailure shim: felix-canary.service declares `OnFailure=felix-canary-onfailure.service`,\
  \ emitting an out-of-band ERROR via scripts/common/alert_bus.sh when a run exits\
  \ non-zero (SC-006 crash detection, independent of runner emit logic \u2014 trust-scan\
  \ lacked this).\n\nTier 3 (installs a user timer + runs a real unit once; no Tier\
  \ 0/1/2 action).\n\nRebaseline: REQUIRED \u2014 systemd units under scripts/office2/\
  \ are a hashed audited surface, so felix-deployer auto-rebaselines on the happy\
  \ path (the change has a repo-file signal; no expected_baselines needed).\n"
