  the operator deploy script credential-liveness-probe.sh. The runner has been\ncredential-generic\
  \ since #845 (subject: felix-google-personal-calendar via\ncalendar_helper --self-check);\
  \ the sole manifest liveness_probe (calendar)\nneeds none of gog / GOG_KEYRING_BACKEND\
  \ / openclaw-gateway.env.\n\nRemoval is safe though openclaw-gateway.env also exported\
  \ VIKUNJA_BASE_URL\n(renata LOW-2): this service runs --liveness-only, whose alert\
  \ path files a\nGitHub issue via the gh CLI and skips the Vikunja/cadence block,\
  \ so\nVIKUNJA_BASE_URL is never resolved; and vikunja_config falls back to\n/data/services/openclaw/config/vikunja-base-url.txt\
  \ anyway (the sibling\ncredential-health-check.service already runs with no EnvironmentFile).\
  \ The\nAfter=openclaw-gateway.service ordering line is intentionally RETAINED\n\
  (ordering-only, mirrors the sibling); #846 scope is the two env lines only.\n\n\
  Tier 3 (systemd user timer content edit; no Tier 0/1/2 action); oneshot fired\n\
  by a 6h timer, so daemon-reload + enable --now is non-disruptive.\naudited_surface:\
  \ true \u2014 the unit-content change drifts\nsystemd-user-unit-contents; felix-deployer's\
  \ deferred-confirm auto-rebaseline\nfires off the repo-file signal (scripts/office2/*.service\
  \ +\nscripts/office2/deploy/*.sh), no manual reset. Rollback: re-add the two lines\n\
  and re-run this entrypoint.\n"
