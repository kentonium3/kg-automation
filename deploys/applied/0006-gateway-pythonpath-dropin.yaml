schema_version: v1
name: gateway-pythonpath-dropin
mission_slug: felix-admin-cron-path-fix-01KWQTY3
tier: 1
entrypoint: scripts/deploy/install-gateway-pythonpath-dropin.py
audited_surface: true
verification:
  pre:
  - systemctl --user is-active openclaw-gateway.service
  post:
  - systemctl --user show openclaw-gateway.service -p Environment | grep 'PYTHONPATH=/home/claude/kg-automation'
  - 'MAINPID=$(systemctl --user show -p MainPID --value openclaw-gateway.service)
    && [ -n "$MAINPID" ] && [ "$MAINPID" != "0" ] && tr ''\0'' ''\n'' < /proc/$MAINPID/environ
    | grep -qx ''PYTHONPATH=/home/claude/kg-automation'' && echo "SC-10b ok: PYTHONPATH=/home/claude/kg-automation
    confirmed in /proc/$MAINPID/environ (live gateway process env)"'
