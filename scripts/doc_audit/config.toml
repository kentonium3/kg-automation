# Driver default configuration
# Override with: python3 scripts/doc_audit/run.py --config <path>

[llm]
model = "claude-haiku-4-5"
api_key_path = "/data/services/openclaw/secrets/anthropic"
max_tokens = 2048

[paths]
# Version-controlled artifacts — read from repo at canonical paths (#361).
# These files live in git, are deployed via `git pull`, and never need to be
# copied into the state dir. Symlinking from state-dir is unnecessary band-aid.
prompts_dir = "/home/claude/kg-automation/scripts/doc_audit/prompts"
signal_to_doc_map = "/home/claude/kg-automation/docs/design/architecture/data/signal-to-doc-map.json"
doc_domain_map = "/home/claude/kg-automation/docs/design/architecture/data/doc-domain-map.json"

# Mutable runtime artifacts — live in state dir or shared logs.
drift_events = "/data/services/security-monitor/logs/drift-events.jsonl"
drift_cursor = "/data/services/security-monitor/.drift-events.cursor"
drift_unmapped = "/data/services/security-monitor/logs/unmapped-events.jsonl"
activity_log_dir = "/home/kgale/second-brain/agents/logs"
tick_signal_path = "/data/services/openclaw/felix-doc-auditor-driver/last-tick.json"

[signals]
# Adapter names; order = priority tiebreaker within priority group.
sources = ["gh_issue", "drift_event"]

[github]
repo = "kentonium3/kg-automation"
bot_identity = "kg-felix-bot"

# Mission `drift-event-auto-resolution-01KS8J32` (#362) — Moment 0 LLM
# judgment for drift events. When `enabled = false`, the pipeline files
# pre-#362 `[doc-audit]` issues per matched mapping (FR-013, NFR-007).
[drift_interpretation]
enabled = true
ledger_path = "/data/services/security-monitor/logs/drift-events-ledger.jsonl"
model = "claude-haiku-4-5-20251001"
api_key_path = "/data/services/openclaw/secrets/anthropic"
timeout_seconds = 30
confidence_threshold = 0.80
