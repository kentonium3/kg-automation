# habits-schedule.yaml — ADR-0002 Phase 3 schedule migration
#
# This file is the canonical input to scripts/habits/migrate_schedule.py.
# It describes the one-shot schedule change applied during this mission:
#   - 7 daily PATCHes: set repeat_after=86400 on the surviving habit tasks.
#   - 1 retire: mark the workout task done=true (it stays in the project
#     with repeat_after=0 so Vikunja's auto-advance does NOT un-retire it).
#   - 3 creates: weekly Mon/Wed/Fri strength-training tasks, inheriting
#     the retired workout task's project_id and labels.
#
# IMPORTANT — workout task ID is a placeholder:
#   The retire op below uses task_id: 17 as a TBD placeholder. Operator MUST
#   confirm the actual workout task ID first by running:
#       python3 -m scripts.habits.identify_workout_task
#   then edit the retire op's task_id (and possibly remove one of the
#   PATCH ops if the lookup returns a different ID from the daily set).
#
# Apply protocol (Tier 2):
#   1. ssh office2-kgale + verify a recent Restic snapshot exists for /data.
#   2. Dry-run first:
#       python3 -m scripts.habits.migrate_schedule \
#           --schedule kitty-specs/habits-native-repeat-jsonl-state-01KS0M59/habits-schedule.yaml \
#           --snapshot-out /data/services/openclaw/state/habits-pre-phase3-snapshot.json \
#           --dry-run
#   3. After reviewing the dry-run plan, set the env-var gate and apply:
#       FELIX_TIER2_PREFLIGHT_OK=yes python3 -m scripts.habits.migrate_schedule \
#           --schedule kitty-specs/habits-native-repeat-jsonl-state-01KS0M59/habits-schedule.yaml \
#           --snapshot-out /data/services/openclaw/state/habits-pre-phase3-snapshot.json
#   4. If anything goes wrong:
#       python3 -m scripts.habits.migrate_schedule \
#           --rollback \
#           --snapshot-file /data/services/openclaw/state/habits-pre-phase3-snapshot.json
#
# See kitty-specs/habits-native-repeat-jsonl-state-01KS0M59/quickstart.md
# for the full walkthrough.

mission_id: "01KS0M59313RF0WVJZTXYDJC6C"

operations:
  # ── 7 daily PATCHes ──────────────────────────────────────────────────
  # Set repeat_after=86400 (daily) and repeat_mode=0 (interval mode).
  # IDs are the 8 known production habit task IDs minus the workout task.

  - op: patch
    task_id: 14
    target:
      repeat_after: 86400
      repeat_mode: 0
    notes: "Daily habit (task 14)"

  - op: patch
    task_id: 15
    target:
      repeat_after: 86400
      repeat_mode: 0
    notes: "Daily habit (task 15)"

  - op: patch
    task_id: 16
    target:
      repeat_after: 86400
      repeat_mode: 0
    notes: "Daily habit (task 16)"

  - op: patch
    task_id: 18
    target:
      repeat_after: 86400
      repeat_mode: 0
    notes: "Daily habit (task 18)"

  - op: patch
    task_id: 19
    target:
      repeat_after: 86400
      repeat_mode: 0
    notes: "Daily habit (task 19)"

  - op: patch
    task_id: 20
    target:
      repeat_after: 86400
      repeat_mode: 0
    notes: "Daily habit (task 20)"

  - op: patch
    task_id: 65
    target:
      repeat_after: 86400
      repeat_mode: 0
    notes: "Daily habit (task 65)"

  # ── 1 retire (workout task) ──────────────────────────────────────────
  # Replaced by the 3 weekly MWF tasks below.
  # task_id is a PLACEHOLDER — confirm via:
  #     python3 -m scripts.habits.identify_workout_task

  - op: retire
    task_id: 17  # placeholder — operator runs identify_workout_task.py to confirm
    notes: "Retire single workout task; replaced by 3 weekly MWF tasks below"

  # ── 3 creates (Mon/Wed/Fri strength training) ───────────────────────
  # project_id and labels are inherited from the retired workout task above.
  # due_date is computed by migrate_schedule.py to the next occurrence of
  # the named weekday at 08:00 UTC.

  - op: create
    schedule:
      repeat_after: 604800
      repeat_mode: 0
    attributes:
      title: "Strength training — Monday"
    notes: "Weekly MWF replacement #1"

  - op: create
    schedule:
      repeat_after: 604800
      repeat_mode: 0
    attributes:
      title: "Strength training — Wednesday"
    notes: "Weekly MWF replacement #2"

  - op: create
    schedule:
      repeat_after: 604800
      repeat_mode: 0
    attributes:
      title: "Strength training — Friday"
    notes: "Weekly MWF replacement #3"

# ── habits: runtime schedule (mission #408 — habit-day-specific-scheduling) ──
#
# This section is the runtime authoring surface for day-of-week filtering and
# the auto-skip sweeper. It is independent of the `operations:` migration list
# above (which is a frozen one-shot record consumed by migrate_schedule.py).
#
# Schema:   see kitty-specs/habit-day-specific-scheduling-01KT48Y6/
#                 contracts/schedule-config.contract.md
# Consumer: scripts/habits/schedule_loader.py (centralizes all reads of this
#           section so other modules never re-parse the YAML).
#
# `designated_weekdays`: optional list of 3-letter ISO weekday abbreviations
# (Mon..Sun). If absent or empty, the habit is daily (every day). If present,
# the habit only appears in the morning check-in on the listed weekdays.
#
# CANONICAL SOURCE OF TRUTH for habit task_ids/titles: LIVE Vikunja project 13
# ("Habits"). Always verify task_id ↔ title bindings against live Vikunja
# (e.g. `GET /api/v1/projects/13/tasks`) before editing this section. Do NOT
# rely on docs/runbooks/habits-ops.md "Current habits" table — that table is
# stale (last regenerated 2026-05-22, pre-#371 inventory) and will mis-bind
# task_ids to the wrong titles. The "stale runbook" follow-up is tracked
# separately (regenerate from live Vikunja when doc-auditor is re-enabled).
#
# When a new strength-training task is created, add an entry here with the
# assigned Vikunja task_id and the corresponding designated_weekdays list,
# then run `set_due_dates.py --reconcile-schedule` to advance due_date.

habits:
  # ── Daily habits (no designated_weekdays — appear every day) ────────
  - task_id: 14
    title: "Wake at 5:00 AM"
    repeat_after_seconds: 86400
  - task_id: 15
    title: "Meditate"
    repeat_after_seconds: 86400
  - task_id: 16
    title: "Morning shoulder PT"
    repeat_after_seconds: 86400
  - task_id: 18
    title: "Get steps in today"
    repeat_after_seconds: 86400
  - task_id: 19
    title: "Read 30 min minimum"
    repeat_after_seconds: 86400
  - task_id: 20
    title: "Evening shoulder PT"
    repeat_after_seconds: 86400
  - task_id: 65
    title: "Morning hip PT"
    repeat_after_seconds: 86400

  # ── Day-specific habits (Mon/Wed/Fri strength training, weekly cadence) ──
  # Bound to live Vikunja task_ids 75/76/77 (verified against project 13).
  - task_id: 75
    title: "Strength training — Monday"
    designated_weekdays: ["Mon"]
    repeat_after_seconds: 604800
  - task_id: 76
    title: "Strength training — Wednesday"
    designated_weekdays: ["Wed"]
    repeat_after_seconds: 604800
  - task_id: 77
    title: "Strength training — Friday"
    designated_weekdays: ["Fri"]
    repeat_after_seconds: 604800
