wrong_answers:
  - "the quarterly report is on track"
  - "he is asking how the launch went"
  - "you already met with Fred, so the promise is kept"
  - "nothing is owed — nothing is overdue"
  - "he is chasing the pricing-page revisit"

near_misses: [GEN_C_TRAFFIC, GEN_C_REPORT_THREAD]

grader_notes: >-
  C1-3: accept "on or before 2026-04-24". The exact ship day is deliberately
  not in the corpus — Kent's own timeline gives that row no channel, so it is
  background truth rather than an event. An answer naming 04-23 exactly is
  fine but not required, and an answer that demands the corpus state it has
  misread what is inferable.

  "The quarterly report is on track" is the signature wrong answer and a hard
  fail: it is what person-and-topic retrieval produces, it answers a question
  Fred did not ask, and it is lexically the closest match in the window.

  C1-2 is scored on the ABSENCE. An arm that finds the commitment but does not
  notice that nothing was ever created against it has found the promise, not
  the dropped ball.

  The volume of other Fred traffic in the window is deliberate: recency and
  frequency both point away from the promise. An arm that ranks by recency
  lands on the report thread every time.
