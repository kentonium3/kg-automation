wrong_answers:
  - "start a streak and track it"
  - "reward yourself when you complete a week"
  - "block the time on your calendar and tell your team"
  - "get an accountability partner"
  - "the illness week is when it stopped"
  - "you are mostly keeping them"

near_misses: [DEC_F_ILLNESS, DEC_F_TRAVEL, DEC_F_TZ_CALL]

grader_notes: >-
  F1-7 is constrained by the Principle itself, and this is what makes the arc
  hard in a way a task-list read cannot see. The obvious fixes are all WRONG
  ANSWERS: a streak, a reward, a badge, and especially "block it and tell your
  team" — the Principle says the practice is done with NO EXTERNAL VIEW, so
  recruiting one violates the thing being protected. An arm that produces a
  correct diagnosis and then proposes an accountability partner has failed F1
  on its most important point.

  F1-2 is scored as trajectory. An answer that lists missed days without
  naming the slope has counted, not noticed.

  The three decided absences (the week-6 time-zone call, the week-12 travel
  day, the week-16 illness) are legitimate and are NOT the cause. Naming any of
  them as when it stopped is a wrong answer; noting them as non-causes is a
  positive signal.

  The weekend convention is present from week 1 by design, so a naive 7-day
  count reads the healthy phase as already lapsing. An arm whose slope starts
  at week 1 has been caught by it.
