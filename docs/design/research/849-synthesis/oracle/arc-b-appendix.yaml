# #849 HIDDEN ORACLE — Arc B
#
# ⛔ THIS FILE IS NEVER LOADED INTO EITHER ARM. ⛔
#
# It is the ground truth B1 and B2 are scored against. #844's hidden-oracle
# rule: the story and its answer are kept together only while authoring, and
# synthesis splits them into physically separate artifacts. Keeping the answer
# key in the seed — even inside a block the renderer strips — was ruled
# insufficient (design lead R2, 2026-09-24T04:48Z): "physically separate" means
# a different file, not a different section.
#
# Everything here is DERIVED from the seed. Nothing here may be inferable only
# from this file — if an oracle point has no primitive behind it in the seed,
# that is a #844 Threats §1 defect and the fix belongs in the SEED, never here.
# Two such gaps have already been found this way (Arc A's "paid, hard to
# reschedule"; Arc B's halfway-point rule).

meta:
  arc: B
  appendix_for: [B1, B2]
  seed_ref: ../seed/arc-b.yaml
  never_load: true

