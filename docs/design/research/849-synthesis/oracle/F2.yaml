grader_notes: >-
  F2-4 is the coaching finding and the highest-value point in the whole corpus.
  Kent's oracle says an arm that NAMES the shared cause has found it. This is
  the only point that requires crossing between two arcs, and the corpus
  supports it because the late-night events are ONE generated set consumed by
  both — not two fabrications that happen to agree.

  Week 14 is the tempting wrong answer for F2: it is where the journalling
  threshold is crossed, so it is the most visible marker. But by then the
  second early call is already standing and the slope is set — the catchable
  moment is earlier and less visible, which is the point.

  F2-3 is scored positively. An arm that reports week 25 as the end of the
  decline has read the trajectory but not the Principle.
