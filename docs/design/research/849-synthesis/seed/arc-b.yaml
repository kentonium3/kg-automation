# #849 seed — Arc B: quiet drift
#
# SEED MATERIAL. Everything here is a primitive the arms may see.
#
# ⚠ TRACEABILITY GAP FOUND AND FIXED HERE — same class as the design lead's
#   Arc A catch (#844 Threats §1), and this one is load-bearing.
#
#   Arc B's oracle names CP2 (Sun 2026-08-09) as THE POINT OF NO RETURN, by
#   Kent's rule: "if the target training pace is not hit at the 50% point of the
#   program, there is no path to recovery." The whole B1 answer turns on it.
#
#   That rule is NOT in Kent's training plan. I checked: the plan states the
#   week-16 gate ("if the 2 x 1 mile workout feels controlled, you are in
#   range") and the red-flag back-off list, but nothing about a 50% point or
#   cumulative conditioning. The worksheet attributes the rule to Kent at
#   authoring time, marked "this is what the oracle computes against".
#
#   So as authored, the oracle's central point had NO primitive behind it. An
#   arm could identify every miss correctly and still have no basis to say
#   recovery was impossible — it would be marked wrong for not knowing a rule
#   the corpus never states.
#
#   FIX: seed the conditioning rule as a primitive, the same way Arc A seeds
#   its Principle verbatim. It is domain knowledge Kent holds, so it belongs in
#   the corpus as something he wrote down. What stays inferable: WHICH
#   checkpoint is the 50% point, whether it was missed, and what follows.
#   Flagged to the design lead rather than resolved silently.

meta:
  arc: B
  contexts: [personal]
  window: {start: 2026-06-15, end: 2026-10-15}
  ontology_ref: docs/design/second-brain-graph-layer.md@884d1c6e
  # Blocks the renderer CONSUMES and never emits verbatim. Declaring them
  # is what makes their oracle-adjacent contents safe: the renderer strips
  # exactly this list, and the freeze check greps the rendered corpus for
  # their words. An undeclared block would be emitted and leak.
  non_rendered: [generator_input, shared_late_nights, non_drifting_control]
  # Rendered-event ids this arc's generator MUST emit. Declared here so oracle
  # traceability (rubric §3.1) is checkable before the renderer exists, and so
  # the renderer is bound to produce exactly these. check_849_oracle unions
  # these with the seed ids; a traceability entry naming anything else fails.
  emits:
    - GEN_B_SESSIONS      # the ~51 core-session events (done / moved / not done)
    - GEN_B_DECISIONS     # the five Decisions + their provenance episodes
    - GEN_B_RACE          # the race-result event (32:50)
    - GEN_B_WK5_TUE
    - GEN_B_WK6_THU
    - GEN_B_WK7_TUE
    - GEN_B_WK7_PROG      # the progression run logged at 11:10
    - GEN_B_WK8_THU
    #
    # ⚠ NOT DECLARED, and the omission is the point: the SILENT misses
    # (wk 6 Sat, wk 7 Sat, wk 8 Tue) have NO event id, because CHOICE F-REP is
    # completions-only — a Vikunja task emits on completion and nothing on a
    # miss. Their evidence is the ABSENCE of a completion in GEN_B_SESSIONS.
    #
    # I originally declared all three and cited two in B1-2's traceability. The
    # renderer's emits contract caught it by refusing to produce them. Two
    # rules that were each correct in isolation — "completions only" and "every
    # declared emit must be produced" — interacted in a way neither of us
    # predicted, and the contract is what surfaced it rather than a review.
    - GEN_B_WK10_THU
    - GEN_B_WK11_TUE
    - GEN_B_WK13_THU
    # The per-week ids are generated from the weeks table above. Declared as a
    # FAMILY rather than enumerated: 24 explicit entries would have to stay in
    # lockstep with that table, and a list that can drift from its own source
    # is worse than no list. Still bounded — an id outside this family fails.
    - GEN_B_WK*

outcomes:
  - id: OUT_5K
    description: Run the 5K at a sub-10-minute-mile average for the full distance
    target_date: 2026-10-15
    success_criteria: "under 31:00 for 3.1 mi (sub-10:00/mi average)"
    domain: DOM_PERSONAL
    serves: PUR_VITALITY

commitments:
  # Hard external: registered and paid. DUE_BY sources from Outcome per the
  # endpoint extension landed @ee1311a5.
  - id: COM_RACE
    counterparty: "Riverside 5K"
    is_external: true
    datetime: 2026-10-15T08:00:00-04:00
    description: Riverside 5K — registered, entry fee paid

edges:
  - {type: DUE_BY, from: OUT_5K, to: COM_RACE}

episodes:
  # Registration — the primitive behind "the date is hard and the fee is paid".
  - id: EP_B_REGISTER
    reference_time: 2026-06-11T20:41:00-04:00
    source_description: "personal email — registration@riverside5k.example"
    content: >-
      Registration confirmed — Riverside 5K, Thursday 15 October 2026, 08:00.
      Entry fee $35.00 charged. Entries are non-refundable and non-transferable.
    mentions: [COM_RACE, OUT_5K]

  # THE PLAN, as Kent wrote it. A real document in the corpus.
  - id: EP_B_PLAN
    reference_time: 2026-06-12T09:15:00-04:00
    source_description: "obsidian note — 5K conditioning plan"
    content_ref: docs/design/research/849-arc-b-training-plan.md
    mentions: [OUT_5K]

  # THE CONDITIONING RULE — the primitive this arc was missing.
  # Kent's own framing, written as a note when he built the plan. It states the
  # rule; it does NOT say which week is the halfway point, whether any
  # checkpoint was hit, or what the miss rate is. Those remain the arm's work.
  #
  # ⚠ R1 (design lead, 2026-09-24T04:48Z): my first version of this note ended
  # with a sentence prescribing what to do once the pace goal is gone. That
  # prescription IS B1's oracle coaching point. I added it while
  # fixing a DIFFERENT traceability gap, which is how this class of leak
  # actually happens: not by carelessness about the rule, but by writing one
  # sentence too many while being careful about something else. Stripped. The
  # rule now tells the arm only that the pace goal is gone; arriving at
  # reset-rather-than-quit is the arm's reasoning and what B1 scores.
  - id: EP_B_CONDITIONING_RULE
    reference_time: 2026-06-12T09:22:00-04:00
    source_description: "obsidian note — how to read the plan"
    content: >-
      How to read this plan. Conditioning is cumulative — it cannot be
      accumulated all at once in a few weeks near the end. Consistent workouts,
      at least three a week, are the only way to meet the targets. Working
      backwards from the race there are mid-programme time and distance
      checkpoints that say whether I am on track. If I am not hitting the target
      training pace by the halfway point of the programme, there is no path to
      recovery for the pace goal. And if I cannot run at race pace two weeks
      before the race, I am unlikely to do it on race day.
    mentions: [OUT_5K]

# --- the sessions ---------------------------------------------------------
#
# 17 weeks x 3 core runs. Rendered as Vikunja recurring-task events (done /
# not done) plus calendar entries, exactly as an adapter would write them.
#
# ⚠ GENERATOR INPUT, not a seed artifact. The weekly table below never reaches
#   the rendered corpus — what reaches it is ~51 individual session events.
#   The renderer strips this block; the freeze check greps for its words.
#
# WHAT IS ABSENT FROM EVERY RENDERED EVENT: any miss rate, any cumulative
# count, any checkpoint verdict, any "near-miss" mark, any decided/silent
# label. The decided/silent split is produced by a Decision node existing or
# not existing — five of the misses have one, five do not.

generator_input:
  seed: 849-arc-b
  plan_ref: docs/design/research/849-arc-b-training-plan.md
  # ⚠ R2 (design lead, 2026-09-24T04:48Z): this block names WHAT HAPPENED and
  # nothing about how it is scored. It previously carried `counted:` and
  # `then_silent:` flags — the oracle's per-miss classification. Even
  # non-rendered, that put the answer key inside the seed artifact, which
  # rubric §9 forbids: the oracle must be PHYSICALLY separate. They now live in
  # oracle/arc-b-oracle.yaml.
  #
  # What remains here is emittable fact: a session was done, moved, or not
  # done; the reason as the primitive it becomes; `decision: true` meaning
  # "emit a Decision plus its provenance episode". `late_night: true` stays —
  # it names events to emit, not a verdict.
  # L1 (design lead, 2026-09-24T14:38Z). Reasons were rendering as event text —
  # "07:30 meeting booked into the slot" STATES the collision; "moved to
  # evening, then not run" STATES the miss. Same class as E-2: the generator's
  # hint written straight into the corpus.
  #
  # A cause is now a TYPE, and the renderer emits the primitives it actually
  # consists of. No event carries a reason-for-the-miss sentence.
  causes:
    early_meeting:
      # A recurring Thursday 07:30 spec-kitty meeting, standing from week 6.
      # Its ACCEPTANCE is the Decision's provenance, in natural words.
      renders: [recurring_calendar_series, acceptance_episode]
      series: {weekday: thu, at: "07:30", account: spec-kitty,
               title: "Weekly pipeline review",
               organiser: "mvale@spec-kitty.example", from_week: 6}
      acceptance_text: "Accepted — Thursday 07:30 works."
    moved_to_evening:
      # A Vikunja reschedule on the run task, and NO completion after it.
      # The absence of the completion is what says it did not happen.
      renders: [task_reschedule]
      reschedule_to: "19:00"
      note: "Moving today's run to this evening."
    favour:
      renders: [inbound_message, calendar_block]
      message: "Any chance you could give me a hand with this after work?"
      block_title: "Helping out"
      block_at: "17:30"
    holiday_july4:
      renders: [calendar_block]
      block_title: "July 4th weekend"
      all_day: true
    holiday_labor:
      renders: [calendar_block]
      block_title: "Labor Day weekend — away"
      all_day: true
    birthday:
      renders: [calendar_block]
      block_title: "Dinner — Joel's birthday"
      block_at: "19:00"
    calf:
      # Legitimate back-off the plan itself prescribes. Rendered as the note a
      # runner writes, not as a verdict about drift.
      renders: [task_note]
      note: "Calf tight again and getting worse on the run. Backing off."
    illness:
      renders: [task_note]
      note: "Head cold. Taking a few days and picking the plan back up after."

  weeks:
    - {wk: 1,  mon: 2026-06-15, done: 3}
    - {wk: 2,  mon: 2026-06-22, done: 3, moved: [{from: thu, to: fri_evening, cause: null, decision: true}]}
    - {wk: 3,  mon: 2026-06-29, done: 2, missed: [{day: sat, cause: holiday_july4, decision: true}]}
    - {wk: 4,  mon: 2026-07-06, done: 3, note: "first 20-min continuous run"}
    - {wk: 5,  mon: 2026-07-13, done: 2, missed: [{day: tue, cause: favour, decision: false}]}
    - {wk: 6,  mon: 2026-07-20, done: 1, missed: [{day: thu, cause: early_meeting, decision: true}, {day: sat, cause: null, decision: false, late_night: true}]}
    - {wk: 7,  mon: 2026-07-27, done: 1, missed: [{day: tue, cause: moved_to_evening, decision: true}, {day: sat, cause: null, decision: false, late_night: true}], note: "progression quicker-5-min run at 11:10"}
    - {wk: 8,  mon: 2026-08-03, done: 1, missed: [{day: tue, cause: null, decision: false, late_night: true}, {day: thu, cause: early_meeting, decision: true}]}
    - {wk: 9,  mon: 2026-08-10, done: 3, note: "6 x 1 min at ~10:40 effort", late_night: true}
    - {wk: 10, mon: 2026-08-17, done: 1, missed: [{day: thu, cause: early_meeting, decision: true}, {day: sat, cause: calf, decision: true}]}
    - {wk: 11, mon: 2026-08-24, done: 2, missed: [{day: tue, cause: favour, decision: false}], late_night: true}
    - {wk: 12, mon: 2026-08-31, done: 2, missed: [{day: sat, cause: holiday_labor, decision: true}]}
    - {wk: 13, mon: 2026-09-07, done: 2, missed: [{day: thu, cause: moved_to_evening, decision: true}], late_night: true}
    - {wk: 14, mon: 2026-09-14, done: 3, note: "3 x 8 min at 10:35", late_night: true}
    - {wk: 15, mon: 2026-09-21, done: 1, missed: [{day: all, cause: illness, decision: true}]}
    - {wk: 16, mon: 2026-09-28, done: 3, note: "2 x 1 mile at 10:25 and 10:40"}
    - {wk: 17, mon: 2026-10-05, done: 3, note: "taper as written"}
  race:
    date: 2026-10-15
    result: "32:50"
    # NOT seeded: "10:35/mi", "sub-10 missed". The pace is arithmetic on the
    # time and the distance; the verdict is the oracle's.

# --- the shared cause ------------------------------------------------------
#
# Arc B does NOT re-author the late nights. It references the single set
# rendered from arc-f.yaml, so the cause Kent's oracle scores is genuinely one
# cause rather than two fabrications that agree. Weeks marked late_night above
# consume those events.
shared_late_nights:
  source: arc-f.yaml#shared_late_nights
  consumed_weeks: [6, 7, 8, 9, 11, 13, 14]

# --- near-miss 5: a non-drifting recurring commitment ----------------------
#
# Arc A's PT sessions run through Arc B's window and do NOT drift, so
# "count deferrals per commitment" cannot win by accident. Rendered from
# arc-a.yaml's COM_PT_TUE / COM_PT_THU across 2026-06-15 -> 2026-10-15.
non_drifting_control:
  source: arc-a.yaml#commitments
  ids: [COM_PT_TUE, COM_PT_THU]
  window: {start: 2026-06-15, end: 2026-10-15}

# --- what is NOT in this file, on purpose ---------------------------------
#
#  * no miss rate, cumulative count, or percentage anywhere
#  * no checkpoint definitions, targets, or pass/fail verdicts (CP1-CP4 are
#    the ORACLE's derivation from the plan plus the conditioning rule)
#  * no "point of no return" marker at wk 8 or anywhere else
#  * no tally of which reasons repeat — the reasons are event text, and the
#    repetition is the finding
#  * no decided/silent labels — five misses have a Decision node, five do not
#  * no "near-miss" marks in the rendered corpus
#  * no race verdict beyond the finish time
#  * no link between the late nights and the missed runs, and none between
#    Arc B and Arc F — the shared cause is shared EVENTS
