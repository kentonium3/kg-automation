[pytest]
# Custom markers used across the repo's test suite.
#
# `live_smoke` is opt-in: tests carrying this marker hit real GitHub +
# real Anthropic APIs and require production secrets to be readable.
# Opt-in is enforced via the ``LIVE_SMOKE_ENABLED=1`` environment
# variable (see ``tests/doc_audit/test_smoke_live.py``); without that
# env var the tests skip cleanly (exit 0, "N skipped"). This avoids the
# pytest-exit-5 footgun that occurs when ``addopts = -m "not live_smoke"``
# deselects every test in an isolated invocation.
markers =
    live_smoke: live integration test requiring real credentials and network connectivity
