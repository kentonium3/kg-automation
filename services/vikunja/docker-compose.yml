# Vikunja Task Manager — docker-compose definition.
#
# Replaces the legacy systemd `Type=simple` + `docker run --rm` pattern
# with the modern compose pattern matching transcribe-api. See #189.
#
# Deployed by: scripts/vikunja/deploy.sh
# Referenced from: /etc/systemd/system/vikunja.service (ExecStart uses
#   `docker compose -f /home/claude/kg-automation/services/vikunja/docker-compose.yml up -d`).
#
# Data volume (`/data/services/vikunja/data`) is a host bind mount holding
# the SQLite DB. Image, bind IP, port, env vars, and container name are
# all preserved exactly from the original `docker run` invocation.
services:
  vikunja:
    image: vikunja/vikunja:0.24.6
    container_name: vikunja
    restart: unless-stopped
    ports:
      - "100.92.197.90:3456:3456"
    volumes:
      - /data/services/vikunja/data:/app/vikunja/files
    environment:
      VIKUNJA_SERVICE_PUBLICURL: https://office2.tail0f5f56.ts.net
      VIKUNJA_SERVICE_INTERFACE: ":3456"
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /app/vikunja/files/vikunja.db
